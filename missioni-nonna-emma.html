<title>Le missioni di nonna Emma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen canvas world, storybook HUD panels pinned to the corners, parchment dialog at the bottom */
:root{
  --ink:#3b2a35; --paper:#fff4dc; --paper-2:#f3dcae; --red:#e5533d; --gold:#ffc93d;
  --leaf:#4caf50; --leaf-dark:#2f8a3a; --grass:#6aa94b; --muted:#8a6f60;
  --display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font-family:var(--display);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.quest{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px 10px;max-width:min(360px,calc(100% - 240px));display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;background:var(--red);color:#fff;font-weight:600;font-size:13px;letter-spacing:.08em;padding:2px 10px;border-radius:99px;border:2px solid var(--ink)}
#questText{font-weight:700;font-size:clamp(17px,2.6vw,24px);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
#questProg{display:flex;gap:6px}
#questProg svg{width:26px;height:26px}
.party{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 6px 6px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:13px;letter-spacing:.05em;transition:transform .12s}
.pc canvas{width:52px;height:52px}
.pc.on{background:var(--gold);transform:translateY(-2px)}
.pc.mus svg{width:52px;height:52px;padding:8px;box-sizing:border-box}
.pc.mus.on{background:var(--paper-2);transform:none}
.pc.mus.on .x{display:none}
.pc:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 24px));box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px 14px}
.pic{flex:none;width:92px;height:92px;border-radius:50%;background:#bfe3a5;border:3px solid var(--ink);overflow:hidden}
.pic canvas{width:100%;height:100%}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dname{align-self:flex-start;background:var(--gold);border:2px solid var(--ink);border-radius:99px;padding:1px 10px;font-weight:600;font-size:14px;letter-spacing:.06em}
.dtext{font-weight:700;font-size:clamp(20px,3.6vw,30px);line-height:1.15;letter-spacing:.02em}
.dbtns{display:flex;flex-direction:column;gap:8px}
.btn{border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:20px;padding:8px 16px;background:var(--leaf);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper-2);color:var(--ink);padding:6px 10px;display:grid;place-items:center}
.btn.ghost svg{width:26px;height:26px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,25,45,.35);padding:16px}
.card{position:relative;text-align:center;padding:30px 28px 26px;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ribbon{position:absolute;top:-18px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 16px;font-weight:700;letter-spacing:.12em;font-size:15px}
.card h1{margin:4px 0 0;font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.02;text-wrap:balance;color:var(--ink)}
.card h1 em{font-style:normal;color:var(--red)}
.card p{margin:0;font-size:17px;color:var(--muted);font-weight:500;max-width:32ch}
.card .btn{font-size:26px;padding:10px 34px;background:#f28c28;margin-top:8px}
.vrow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;font-weight:600;font-size:15px;color:var(--muted)}
.vrow select{font-family:var(--display);font-size:15px;color:var(--ink);background:var(--paper-2);border:2px solid var(--ink);border-radius:10px;padding:5px 8px;max-width:220px}
.vrow .btn.ghost{font-size:15px;padding:4px 12px;box-shadow:0 3px 0 var(--ink)}
.stars{display:flex;gap:6px}
.stars svg{width:52px;height:52px}
@media (max-width:520px){.pic{width:64px;height:64px}.dialog{gap:10px;padding:10px}.btn{font-size:18px;padding:6px 12px}.pc canvas,.pc.mus svg{width:42px;height:42px}.quest{max-width:calc(100% - 215px)}}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>

<canvas id="game" aria-label="Il giardino di nonna Emma"></canvas>

<div class="quest panel" id="quest" aria-live="polite">
  <span class="tag">MISSIONE</span>
  <div id="questText">VAI DA NONNA EMMA</div>
  <div id="questProg"></div>
</div>

<div class="party">
  <button class="pc on" id="bMaci" aria-label="Gioca con Maci"><canvas width="104" height="104"></canvas>MACI</button>
  <button class="pc" id="bPiumi" aria-label="Gioca con Piumi"><canvas width="104" height="104"></canvas>PIUMI</button>
  <button class="pc mus on" id="bMus" aria-label="Accendi o spegni la musica" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="currentColor"/><circle cx="17.5" cy="16" r="3" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="#e5533d" stroke-width="3" stroke-linecap="round"/></svg>MUSICA</button>
</div>

<div class="dialog panel" id="dlg" hidden>
  <div class="pic"><canvas id="dlgPic" width="184" height="184"></canvas></div>
  <div class="dbody"><span class="dname" id="dName"></span><div class="dtext" id="dText"></div></div>
  <div class="dbtns">
    <button class="btn ghost" id="dSay" aria-label="Ascolta la frase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="btn" id="dOk">OK</button>
  </div>
</div>

<div class="overlay" id="start">
  <div class="card panel">
    <span class="ribbon">LIVELLO 1</span>
    <h1>Le missioni di <em>nonna Emma</em></h1>
    <p>Tocca il prato per far camminare il gatto. Sul computer puoi usare le frecce.</p>
    <button class="btn" id="play">GIOCA</button>
    <div class="vrow"><label for="voice">Voce</label><select id="voice"></select><button class="btn ghost" id="voiceTry" type="button">Prova</button></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card panel">
    <span class="ribbon">LIVELLO 1 COMPLETATO</span>
    <div class="stars" id="stars"></div>
    <h1>MIAO&#8209;RAVIGLIOSO!</h1>
    <p>Margherita ha la sua coroncina di margherite.</p>
    <button class="btn" id="again">GIOCA ANCORA</button>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const OL='#3b2a35',WW=1400,WH=1000,TAU=Math.PI*2;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let VW,VH,DPR,Z;
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;Z=Math.max(.55,Math.min(1.25,Math.min(VW,VH)/620));}
addEventListener('resize',resize);resize();

let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const E=(c,x,y,rx,ry,rot)=>{c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);};
const C=(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,TAU);};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const fs=(c,f,lw)=>{c.fillStyle=f;c.fill();c.lineWidth=lw||3;c.strokeStyle=OL;c.stroke();};

/* ---------- world ---------- */
const house={x:140,y:200,w:280,h:135};
const pond={x:900,y:305,rx:170,ry:100};
const trees=[[640,130],[770,95],[1110,130],[1270,250],[1230,560],[80,640],[170,840],[620,720],[990,840],[1320,820],[60,260],[520,95]].map(([x,y])=>({x,y}));
const emma={x:500,y:360};
const girl={x:1210,y:890,crown:false};
const DAISY_POS=[[700,530],[1090,455],[300,820]];
const VASE_POS=[[190,445],[330,470],[600,470],[470,565]];
const pathPts=[[280,345],[300,620],[900,600],[1225,990]];
const tufts=[],flowers=[],bushes=[];
for(let i=0;i<480;i++)tufts.push([R()*WW,R()*WH]);
const FCOL=['#ef5a6f','#6a8ff0','#b46ee0','#ff9a3d'];
for(let i=0;i<80;i++){const x=60+R()*(WW-120),y=80+R()*(WH-130);
  if(x>house.x-30&&x<house.x+house.w+30&&y>house.y-140&&y<house.y+house.h+20)continue;
  if(((x-pond.x)/(pond.rx+20))**2+((y-pond.y)/(pond.ry+20))**2<1)continue;
  if(DAISY_POS.some(([a,b])=>Math.hypot(a-x,b-y)<60))continue;
  flowers.push([x,y,FCOL[i%4]]);}
for(let i=0;i<16;i++){const side=i%4;let x,y;
  if(side==0){x=80+R()*(WW-160);y=62;}else if(side==1){x=52;y=120+R()*(WH-240);}else if(side==2){x=WW-52;y=120+R()*(WH-240);}else{x=80+R()*1000;y=WH-40;}
  bushes.push([x,y,18+R()*10]);}

const CATS={
  maci:{name:'MACI',body:'#2b2930',belly:'#ffffff',ear:'#f4a6b6',eye:'#e9dc6a',kind:'maci'},
  piumi:{name:'PIUMI',body:'#a2978c',belly:'#f3ece2',ear:'#f4b0b0',eye:'#f2d34a',kind:'piumi'},
  emma:{name:'NONNA EMMA',body:'#a8804f',belly:'#fff8ef',ear:'#f0b3a6',eye:'#9cc06a',kind:'emma'}
};

/* ---------- game state ---------- */
let S;
function freshState(){
  const items=['nastro','chiocciola','sasso','vuoto'].sort(()=>Math.random()-.5);
  return{state:0,count:0,cur:'maci',started:false,
    p:{x:580,y:410,f:1,moving:false},q:{x:540,y:432,f:1,moving:false},
    daisies:DAISY_POS.map(([x,y])=>({x,y,got:false})),
    vases:VASE_POS.map(([x,y],i)=>({x,y,item:items[i],lifted:false,lt:0,wob:0}))};
}
S=freshState();
let trail=[],target=null,ptrDown=false,keys={},floats=[],parts=[],T=0,dlg=null,voice=true,emmaReady=true,girlReady=true,hintCD=0,endTimer=0;

/* ---------- audio ---------- */
let AC=null;
function tone(f,d,delay,type){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;const t0=AC.currentTime+(delay||0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.18,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.05);}catch(e){}}
const sfx={pick:()=>{tone(660,.15);tone(880,.15,.08);tone(1320,.22,.16);},pop:()=>tone(420,.12,0,'sine'),win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,i*.11)),meow:()=>{tone(700,.1,0,'sine');tone(520,.2,.08,'sine');}};
const music=new Audio('audio/stage1.mp3');music.loop=true;music.preload='auto';
const VOL=.35;music.volume=VOL;
let musicOn=true;try{musicOn=localStorage.getItem('musica')!=='no';}catch(e){}
function setMusic(on){musicOn=on;try{localStorage.setItem('musica',on?'si':'no');}catch(e){}
  const b=document.getElementById('bMus');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);
  if(on&&S.started)music.play().catch(()=>{});else music.pause();}
let voices=[],chosen=null;
function voiceScore(v){const n=v.name.toLowerCase();let s=0;
  if(/natural|neural|online/.test(n))s+=50;if(/premium/.test(n))s+=45;if(/enhanced|migliorat/.test(n))s+=35;if(/google/.test(n))s+=30;
  if(/alice|federica|elsa|isabella|paola|emma|silvia|giulia/.test(n))s+=8;if(/luca|diego|cosimo|giuseppe|benigno/.test(n))s+=2;
  if(/compact|espeak/.test(n))s-=40;if(v.localService===false)s+=5;return s;}
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));}catch(e){voices=[];}
  let saved=null;try{saved=localStorage.getItem('voce');}catch(e){}
  chosen=voices.find(v=>v.name==saved)||voices[0]||null;
  const sel=document.getElementById('voice');if(!sel)return;
  sel.innerHTML=voices.length?voices.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name.replace(/</g,'&lt;')}</option>`).join(''):'<option>Voce del dispositivo</option>';
  if(chosen)sel.value=chosen.name;}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
const VOX={emma:{pitch:.95,rate:.82},girl:{pitch:1.3,rate:.95},cat:{pitch:1.15,rate:.9}};
const CLIPS={emma:['CIAO MACI!','CIAO PIUMI!','OGGI È LA FESTA DI MARGHERITA.','TROVA 3 MARGHERITE!','NON HAI ANCORA MARGHERITE.','HAI 1 MARGHERITA.','HAI 2 MARGHERITE.','NE MANCANO 3!','NE MANCANO 2!','NE MANCA 1!','BRAVO! CHE BELLE!','BRAVA! CHE BELLE!','SERVE UN NASTRO.','CERCA SOTTO IL VASO!','IL NASTRO È SOTTO UN VASO.','PROVA TUTTI I VASI!','CORRI!','PORTA I FIORI A MARGHERITA!','MIAO! CHE BELLA FESTA!'],
  girl:['CIAO MACI!','CIAO PIUMI!',"DOV'È NONNA EMMA?",'CIAO MACI E PIUMI!','CHE BELLE MARGHERITE!','GRAZIE! VI VOGLIO BENE!','CHE BELLA CORONCINA!']};
let clip=null;
function stopVoice(){try{speechSynthesis.cancel();}catch(e){}if(clip){clip.pause();clip=null;}}
function say(t,who){if(!voice)return;stopVoice();
  const k=(CLIPS[who]||[]).indexOf(t);
  if(k>=0){clip=new Audio('audio/voce/'+(who=='emma'?'e':'m')+String(k+1).padStart(2,'0')+'.mp3');clip.play().catch(()=>ttsSay(t,who));return;}
  ttsSay(t,who);}
function ttsSay(t,who){try{speechSynthesis.cancel();
  const txt=t.toLowerCase().replace(/!/g,'! ').replace(/\./g,'. ');
  const u=new SpeechSynthesisUtterance(txt);u.lang='it-IT';if(chosen)u.voice=chosen;
  const p=VOX[who]||VOX.cat;u.pitch=p.pitch;u.rate=p.rate;speechSynthesis.speak(u);}catch(e){}}

/* ---------- drawing: characters ---------- */
function drawCat(c,x,y,cat,o){
  c.save();c.translate(x,y);const s=o.scale||1;c.scale(s*(o.f||1),s);
  const t=o.t||0,mv=o.moving,bob=RM?0:(mv?Math.abs(Math.sin(t*12))*3:Math.sin(t*2)*.8);
  c.lineJoin='round';c.lineCap='round';
  if(!o.noShadow){E(c,0,0,24,7);c.fillStyle='rgba(40,30,40,.18)';c.fill();}
  const sway=RM?0:Math.sin(t*(mv?10:2.5))*6,tw=cat.kind=='piumi'?14:8;
  let tx,ty;c.beginPath();
  if(o.sit){c.moveTo(-8,-6);c.quadraticCurveTo(-32,-2,-28+sway*.3,-24);tx=-28+sway*.3;ty=-24;}
  else{c.moveTo(-14,-18);c.quadraticCurveTo(-36,-24,-30+sway,-46);tx=-30+sway;ty=-46;}
  c.strokeStyle=OL;c.lineWidth=tw+6;c.stroke();c.strokeStyle=cat.body;c.lineWidth=tw;c.stroke();
  if(cat.kind=='piumi'){c.strokeStyle='#c4b9ad';c.lineWidth=3;c.stroke();}
  if(cat.kind=='emma'){C(c,tx,ty,tw/2+1);c.fillStyle='#1e1b20';c.fill();}
  if(!o.sit){const ph=mv&&!RM?Math.sin(t*12):0;
    [[-11,ph],[11,-ph],[-4,-ph],[14,ph]].forEach(([lx,p],i)=>{const ox=lx+p*4;rr(c,ox-5,-16,10,15,5);fs(c,i<2?shade(cat.body):cat.body,2.5);
      if(cat.kind!='piumi'){E(c,ox,-3,5,3);c.fillStyle='#fff';c.fill();}});}
  if(o.sit)E(c,0,-20,18,20);else E(c,0,-17-bob*.3,20,14);
  c.fillStyle=cat.body;c.fill();
  c.save();c.clip();
  if(o.sit)E(c,5,-15,10,14);else E(c,9,-14,9,9);c.fillStyle=cat.belly;c.fill();
  if(cat.kind=='emma'){c.strokeStyle='#4a3626';c.lineWidth=3;for(let i=-16;i<12;i+=7){c.beginPath();c.moveTo(i,-40);c.lineTo(i-3,-22);c.stroke();}}
  if(cat.kind=='piumi'){c.strokeStyle='#8c8176';c.lineWidth=2;for(let i=-14;i<10;i+=6){c.beginPath();c.moveTo(i,-6);c.lineTo(i+3,-12);c.stroke();}}
  c.restore();
  if(o.sit)E(c,0,-20,18,20);else E(c,0,-17-bob*.3,20,14);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  if(o.sit){[[-6],[8]].forEach(([px])=>{E(c,px,-3,6,4);fs(c,cat.kind=='piumi'?cat.body:'#fff',2.5);});}
  const hx=6,hy=(o.sit?-46:-40)-bob;
  [[-16,-6,-12,-28,-2,-15],[4,-15,14,-28,18,-6]].forEach(a=>{c.beginPath();c.moveTo(hx+a[0],hy+a[1]);c.lineTo(hx+a[2],hy+a[3]);c.lineTo(hx+a[4],hy+a[5]);c.closePath();fs(c,cat.body);
    c.beginPath();c.moveTo(hx+a[0]*.6+a[2]*.4,hy+a[1]*.6+a[3]*.4+3);c.lineTo(hx+a[2]*.85+a[4]*.15,hy+a[3]+6);c.lineTo(hx+a[4]*.6+a[2]*.4,hy+a[5]*.6+a[3]*.4+3);c.closePath();c.fillStyle=cat.ear;c.fill();});
  if(cat.kind=='piumi'){[[-1,1],[1,1]].forEach(([d])=>{c.beginPath();const bx=hx+d*16;c.moveTo(bx,hy-2);c.lineTo(bx+d*10,hy+4);c.lineTo(bx+d*2,hy+6);c.lineTo(bx+d*8,hy+11);c.lineTo(bx-d*2,hy+12);c.closePath();fs(c,cat.body,2.5);});}
  C(c,hx,hy,18);c.fillStyle=cat.body;c.fill();
  c.save();C(c,hx,hy,18);c.clip();
  if(cat.kind=='maci'){c.beginPath();c.moveTo(hx+2,hy-19);c.lineTo(hx+7,hy+2);c.lineTo(hx-2,hy+2);c.closePath();c.fillStyle='#fff';c.fill();}
  E(c,hx+3,hy+8,11,7);c.fillStyle=cat.belly;c.fill();
  if(cat.kind=='maci'){E(c,hx+3,hy+4.5,5,2.6);c.fillStyle='#141016';c.fill();}
  if(cat.kind!='maci'){c.strokeStyle=cat.kind=='emma'?'#4a3626':'#7d7266';c.lineWidth=2.5;[-4,1,6].forEach(d=>{c.beginPath();c.moveTo(hx+d,hy-17);c.lineTo(hx+d*.7,hy-10);c.stroke();});}
  if(cat.kind=='emma'){c.strokeStyle='#4a3626';c.lineWidth=2.5;[[-18,0],[-18,5],[18,0],[18,5]].forEach(([dx,dy])=>{c.beginPath();c.moveTo(hx+dx,hy+dy);c.lineTo(hx+dx*.75,hy+dy);c.stroke();});}
  c.restore();
  C(c,hx,hy,18);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  const eyes=[[hx-5,hy-2],[hx+10,hy-2]];
  if(cat.kind=='emma'){
    eyes.forEach(([ex,ey])=>{c.beginPath();c.arc(ex,ey+2,3.8,Math.PI*1.15,Math.PI*1.85);c.strokeStyle=OL;c.lineWidth=2.5;c.stroke();
      C(c,ex,ey,7);c.strokeStyle='#d9a73a';c.lineWidth=2.5;c.stroke();});
    c.beginPath();c.moveTo(hx+2,hy-3);c.lineTo(hx+3,hy-3);c.stroke();
  }else{
    const blink=!RM&&((t+o.seed*1.7)%4.2)<.13;
    eyes.forEach(([ex,ey])=>{if(blink){c.beginPath();c.moveTo(ex-4,ey);c.lineTo(ex+4,ey);c.strokeStyle=OL;c.lineWidth=2.5;c.stroke();return;}

/* ---------- collisions ---------- */
function blocked(x,y){
  if(x<55||x>WW-55||y<75||y>WH-38)return true;
  if(x>house.x-14&&x<house.x+house.w+14&&y>house.y&&y<house.y+house.h+10)return true;
  if(((x-pond.x)/(pond.rx+14))**2+((y-pond.y)/(pond.ry+12))**2<1)return true;
  for(const t of trees)if(Math.hypot(t.x-x,t.y-y)<26)return true;
  for(const v of S.vases)if(!v.lifted&&Math.hypot(v.x-x,v.y-y)<22)return true;
  if(Math.hypot(emma.x-x,emma.y-y)<28)return true;
  if(Math.hypot(girl.x-x,girl.y-y)<20)return true;
  return false;
}

  if(endTimer>0){endTimer-=dt;if(endTimer<=0)document.getElementById('end').hidden=false;}
  const p=S.p;let dx=0,dy=0;
  if(S.started&&!dlg){
    if(keys.arrowleft||keys.a)dx-=1;if(keys.arrowright||keys.d)dx+=1;if(keys.arrowup||keys.w)dy-=1;if(keys.arrowdown||keys.s)dy+=1;
    if(dx||dy)target=null;
    else if(target){const ex=target.x-p.x,ey=target.y-p.y,d=Math.hypot(ex,ey);if(d>6){dx=ex/d;dy=ey/d;}else target=null;}
  }
  const len=Math.hypot(dx,dy);p.moving=len>0;
  if(len){dx/=len;dy/=len;const sp=180*dt;const nx=p.x+dx*sp,ny=p.y+dy*sp;let moved=false;
    if(!blocked(nx,p.y)){p.x=nx;moved=true;}if(!blocked(p.x,ny)){p.y=ny;moved=true;}
    if(!moved){target=null;p.moving=false;}
    if(Math.abs(dx)>.15)p.f=dx>0?1:-1;
    const last=trail[trail.length-1];if(!last||Math.hypot(last.x-p.x,last.y-p.y)>4)trail.push({x:p.x,y:p.y});if(trail.length>60)trail.shift();}
  const q=S.q;const tgt=trail.length>9?trail[trail.length-9]:null;
  if(tgt&&Math.hypot(tgt.x-q.x,tgt.y-q.y)>2){const ex=tgt.x-q.x,ey=tgt.y-q.y,d=Math.hypot(ex,ey),st=Math.min(d,190*dt);q.x+=ex/d*st;q.y+=ey/d*st;q.moving=true;if(Math.abs(ex)>1)q.f=ex>0?1:-1;}else q.moving=false;
  if(!S.started||dlg)return;
  S.daisies.forEach(d=>{if(d.got||Math.hypot(d.x-p.x,d.y-p.y)>36)return;
    if(S.state<1){if(hintCD<=0){floatText(d.x,d.y-50,'PRIMA VAI DA NONNA EMMA','#ffe9a8');hintCD=2.5;}return;}
    d.got=true;S.count++;sfx.pick();burst(d.x,d.y-12,22,['#fff','#ffe14d','#ffc93d']);floatText(d.x,d.y-50,S.count+' MARGHERIT'+(S.count==1?'A':'E')+'!');
    if(S.count>=3&&S.state==1){S.state=2;floatText(p.x,p.y-90,BRAV()+'!','#ffc93d');}updateHUD();});
  S.vases.forEach(v=>{if(v.lifted||Math.hypot(v.x-p.x,v.y-p.y)>44)return;
    if(S.state!=3){if(v.wob<=0){v.wob=.35;sfx.pop();}return;}
    v.lifted=true;v.lt=0;sfx.pop();
    const word={nastro:'IL NASTRO!',chiocciola:'UNA CHIOCCIOLA',sasso:'UN SASSO',vuoto:'VUOTO'}[v.item];
    floatText(v.x,v.y-80,word,v.item=='nastro'?'#ff9cc6':'#fff');
    if(v.item=='nastro'){sfx.pick();burst(v.x,v.y-20,30,['#ff6fa8','#fff','#ffc93d']);S.state=4;updateHUD();}});
  const de=Math.hypot(emma.x-p.x,emma.y-p.y);if(de>110)emmaReady=true;if(de<70&&emmaReady){emmaReady=false;talkEmma();}
  const dg=Math.hypot(girl.x-p.x,girl.y-p.y);if(dg>110)girlReady=true;if(dg<70&&girlReady){girlReady=false;talkGirl();}
}

/* ---------- render ---------- */
function guideTarget(){
  if(S.state==0||S.state==2)return{x:emma.x,y:emma.y-92};
  if(S.state==4)return{x:girl.x,y:girl.y-150};
  let best=null,bd=1e9;
  const list=S.state==1?S.daisies.filter(d=>!d.got):S.state==3?S.vases.filter(v=>!v.lifted):[];
  list.forEach(o=>{const d=Math.hypot(o.x-S.p.x,o.y-S.p.y);if(d<bd){bd=d;best=o;}});
  return best?{x:best.x,y:best.y-(S.state==1?52:72)}:null;
}
function render(){
  const cam=camera(),c=ctx;
  c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#5f9a44';c.fillRect(0,0,VW,VH);
  c.setTransform(DPR*Z,0,0,DPR*Z,-cam.x*DPR*Z,-cam.y*DPR*Z);
  c.fillStyle='#8fd16a';c.fillRect(0,0,WW,WH);
  c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(...pathPts[0]);c.bezierCurveTo(...pathPts[1],...pathPts[2],...pathPts[3]);
  c.strokeStyle='#c9a86e';c.lineWidth=62;c.stroke();c.strokeStyle='#ecd39c';c.lineWidth=52;c.stroke();
  for(let i=0;i<14;i++){const tt=i/13,u=1-tt;const bx=u*u*u*280+3*u*u*tt*300+3*u*tt*tt*900+tt*tt*tt*1225,by=u*u*u*345+3*u*u*tt*620+3*u*tt*tt*600+tt*tt*tt*990;E(c,bx+(i%2?10:-12),by,7,4);c.fillStyle='#d8bb82';c.fill();}
  rr(c,house.x+10,house.y+house.h-6,house.w-20,70,10);c.fillStyle='#e3cfa8';c.fill();
  c.strokeStyle='#cdb68b';c.lineWidth=2;for(let i=1;i<7;i++){c.beginPath();c.moveTo(house.x+10+i*37,house.y+house.h);c.lineTo(house.x+10+i*37,house.y+house.h+60);c.stroke();}
  drawPond(c,T);
  c.strokeStyle='#6fb84f';c.lineWidth=2;tufts.forEach(([x,y])=>{c.beginPath();c.moveTo(x-4,y-5);c.lineTo(x,y);c.lineTo(x+4,y-6);c.stroke();});
  flowers.forEach(([x,y,col])=>{for(let k=0;k<5;k++){const a=k/5*TAU;C(c,x+Math.cos(a)*3.6,y+Math.sin(a)*3.6,3);c.fillStyle=col;c.fill();}C(c,x,y,2);c.fillStyle='#ffe14d';c.fill();});
  drawBorderBack(c);
  bushes.forEach(([x,y,r])=>{C(c,x,y-r*.6,r);fs(c,'#5fb84f');C(c,x-r*.3,y-r,r*.35);c.fillStyle='#86d36a';c.fill();});
  const ents=[];
  trees.forEach(t=>ents.push([t.y,()=>drawTree(c,t.x,t.y)]));
  ents.push([house.y+house.h,()=>drawHouse(c)]);
  S.vases.forEach(v=>ents.push([v.y,()=>drawVase(c,v,T)]));
  S.daisies.forEach(d=>{if(d.got)return;ents.push([d.y,()=>{
    const b=RM?0:Math.sin(T*3+d.x)*3;E(c,d.x,d.y,12,4);c.fillStyle='rgba(40,30,40,.15)';c.fill();
    c.beginPath();c.moveTo(d.x,d.y);c.lineTo(d.x,d.y-18);c.strokeStyle=OL;c.lineWidth=5;c.stroke();c.strokeStyle='#4caf50';c.lineWidth=3;c.stroke();
    E(c,d.x+7,d.y-7,7,3,-.5);fs(c,'#5bbf5a',2);
    daisy(c,d.x,d.y-24-b,14,RM?0:T*.6);
    const sp=(T*2+d.x)%2;if(sp<1&&!RM){const sx=d.x+16,sy=d.y-44,k=Math.sin(sp*Math.PI)*6;c.beginPath();c.moveTo(sx,sy-k);c.lineTo(sx+k*.3,sy);c.lineTo(sx,sy+k);c.lineTo(sx-k*.3,sy);c.closePath();c.fillStyle='#fff7b0';c.fill();}
  }]);});
  ents.push([emma.y,()=>drawCat(c,emma.x,emma.y,CATS.emma,{sit:true,f:S.p.x<emma.x?-1:1,t:T,seed:3})]);
  ents.push([girl.y,()=>drawGirl(c,girl.x,girl.y,{t:T,wave:S.state==4||S.state==5,crown:girl.crown})]);
  ents.push([S.q.y,()=>drawCat(c,S.q.x,S.q.y,CATS[other()],{f:S.q.f,t:T,moving:S.q.moving,seed:2})]);
  ents.push([S.p.y,()=>drawCat(c,S.p.x,S.p.y,CATS[S.cur],{f:S.p.f,t:T,moving:S.p.moving,seed:1})]);
  ents.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]());
  drawBorderFront(c);
  if(target&&S.started){E(c,target.x,target.y,14,6);c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=3;c.stroke();}
  parts.forEach(p=>{c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.min(1,p.life*1.5);c.fillStyle=p.col;c.fillRect(-p.r,-p.r/2,p.r*2,p.r);c.restore();});
  c.textAlign='center';c.font='700 24px Fredoka, "Trebuchet MS", sans-serif';c.lineJoin='round';
  floats.forEach(f=>{const a=Math.max(0,1-Math.max(0,f.t-1)/.8);c.globalAlpha=a;const y=f.y-f.t*26;c.lineWidth=6;c.strokeStyle=OL;c.strokeText(f.txt,f.x,y);c.fillStyle=f.col;c.fillText(f.txt,f.x,y);});
  c.globalAlpha=1;
  const g=guideTarget();
  if(g&&!dlg){
    c.setTransform(DPR,0,0,DPR,0,0);
    let sx=(g.x-cam.x)*Z,sy=(g.y-cam.y)*Z;const m=56,top=110;
    const inside=sx>m&&sx<VW-m&&sy>top&&sy<VH-m;
    let ang=Math.PI/2;
    if(!inside){const cx=VW/2,cy=VH/2;ang=Math.atan2(sy-cy,sx-cx);sx=Math.max(m,Math.min(VW-m,sx));sy=Math.max(top,Math.min(VH-m,sy));}
    else sy+=RM?0:Math.sin(T*6)*6-6;
    c.save();c.translate(sx,sy);c.rotate(ang);c.beginPath();c.moveTo(16,0);c.lineTo(-10,-14);c.lineTo(-4,0);c.lineTo(-10,14);c.closePath();
    c.fillStyle='#ffc93d';c.fill();c.lineWidth=3.5;c.strokeStyle=OL;c.lineJoin='round';c.stroke();c.restore();
  }
}
function drawPortraits(){
  [['bMaci','maci'],['bPiumi','piumi']].forEach(([id,k])=>{const pc=document.querySelector('#'+id+' canvas'),p=pc.getContext('2d');p.setTransform(1,0,0,1,0,0);p.clearRect(0,0,104,104);p.setTransform(1.55,0,0,1.55,0,0);drawCat(p,30,62,CATS[k],{f:1,t:0,sit:true,noShadow:true,seed:0});});
}

/* ---------- loop + hot reload ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
function start(data){
  if(data&&data.S){S=data.S;girl.crown=!!data.crown;if(S.started)document.getElementById('start').hidden=true;if(S.state==5&&girl.crown)document.getElementById('end').hidden=false;}
  updateHUD();drawPortraits();document.getElementById('bMus').classList.toggle('on',musicOn);requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawPortraits);
}
window.claude?.hot?.snapshot?.(()=>({S,crown:girl.crown}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
