<title>Le missioni di nonna Emma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen canvas world, storybook HUD panels pinned to the corners, parchment dialog at the bottom */
:root{
  --ink:#3b2a35; --paper:#fff4dc; --paper-2:#f3dcae; --red:#e5533d; --gold:#ffc93d;
  --leaf:#4caf50; --leaf-dark:#2f8a3a; --grass:#6aa94b; --muted:#8a6f60;
  --display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font-family:var(--display);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.quest{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px 10px;max-width:min(360px,calc(100% - 240px));display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;background:var(--red);color:#fff;font-weight:600;font-size:13px;letter-spacing:.08em;padding:2px 10px;border-radius:99px;border:2px solid var(--ink)}
#questText{font-weight:700;font-size:clamp(17px,2.6vw,24px);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
#questProg{display:flex;gap:6px}
#questProg svg{width:26px;height:26px}
.party{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 6px 6px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:13px;letter-spacing:.05em;transition:transform .12s}
.pc canvas{width:52px;height:52px}
.pc.on{background:var(--gold);transform:translateY(-2px)}
.pc.mus svg{width:52px;height:52px;padding:8px;box-sizing:border-box}
.pc.mus.on{background:var(--paper-2);transform:none}
.pc.mus.on .x{display:none}
.pc:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 24px));box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px 14px}
.pic{flex:none;width:92px;height:92px;border-radius:50%;background:#bfe3a5;border:3px solid var(--ink);overflow:hidden}
.pic canvas{width:100%;height:100%}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dname{align-self:flex-start;background:var(--gold);border:2px solid var(--ink);border-radius:99px;padding:1px 10px;font-weight:600;font-size:14px;letter-spacing:.06em}
.dtext{font-weight:700;font-size:clamp(20px,3.6vw,30px);line-height:1.15;letter-spacing:.02em}
.dbtns{display:flex;flex-direction:column;gap:8px}
.btn{border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:20px;padding:8px 16px;background:var(--leaf);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper-2);color:var(--ink);padding:6px 10px;display:grid;place-items:center}
.btn.ghost svg{width:26px;height:26px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,25,45,.35);padding:16px}
.card{position:relative;text-align:center;padding:30px 28px 26px;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ribbon{position:absolute;top:-18px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 16px;font-weight:700;letter-spacing:.12em;font-size:15px}
.card h1{margin:4px 0 0;font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.02;text-wrap:balance;color:var(--ink)}
.card h1 em{font-style:normal;color:var(--red)}
.card p{margin:0;font-size:17px;color:var(--muted);font-weight:500;max-width:32ch}
.card .btn{font-size:26px;padding:10px 34px;background:#f28c28;margin-top:8px}
.levels{display:grid;gap:10px;width:100%;margin-top:6px}
.lvl{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);text-align:left}
.lvl:hover{background:var(--gold)}
.lvl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lvl b{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#f28c28;color:#fff;border:3px solid var(--ink);font-size:22px}
.lvl span{font-weight:600;font-size:19px;line-height:1.1}
.card .btn.alt{background:var(--leaf);font-size:20px;padding:8px 24px;margin-top:0}
.link{background:none;border:0;font-weight:600;font-size:15px;color:var(--muted);text-decoration:underline;padding:4px}
.stars{display:flex;gap:6px}
.stars svg{width:52px;height:52px}
@media (max-width:520px){.pic{width:64px;height:64px}.dialog{gap:10px;padding:10px}.btn{font-size:18px;padding:6px 12px}.pc canvas,.pc.mus svg{width:42px;height:42px}.quest{max-width:calc(100% - 215px)}}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>

<canvas id="game" aria-label="Il gioco"></canvas>

<div class="quest panel" id="quest" aria-live="polite">
  <span class="tag">MISSIONE</span>
  <div id="questText">VAI DA NONNA EMMA</div>
  <div id="questProg"></div>
</div>

<div class="party">
  <button class="pc on" id="bMaci" aria-label="Gioca con Maci"><canvas width="104" height="104"></canvas>MACI</button>
  <button class="pc" id="bPiumi" aria-label="Gioca con Piumi"><canvas width="104" height="104"></canvas>PIUMI</button>
  <button class="pc mus on" id="bMus" aria-label="Accendi o spegni la musica" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="currentColor"/><circle cx="17.5" cy="16" r="3" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="#e5533d" stroke-width="3" stroke-linecap="round"/></svg>MUSICA</button>
</div>

<div class="dialog panel" id="dlg" hidden>
  <div class="pic"><canvas id="dlgPic" width="184" height="184"></canvas></div>
  <div class="dbody"><span class="dname" id="dName"></span><div class="dtext" id="dText"></div></div>
  <div class="dbtns">
    <button class="btn ghost" id="dSay" aria-label="Ascolta la frase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="btn" id="dOk">OK</button>
  </div>
</div>

<div class="overlay" id="start">
  <div class="card panel">
    <span class="ribbon">SCEGLI IL LIVELLO</span>
    <h1>Le missioni di <em>nonna Emma</em></h1>
    <p>Tocca il pavimento o il prato per far camminare il gatto. Sul computer puoi usare le frecce.</p>
    <div class="levels" id="levels"></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card panel">
    <span class="ribbon" id="endRibbon">LIVELLO COMPLETATO</span>
    <div class="stars" id="stars"></div>
    <h1>MIAO&#8209;RAVIGLIOSO!</h1>
    <p id="endText"></p>
    <button class="btn" id="next">LIVELLO 2</button>
    <button class="btn alt" id="again">GIOCA ANCORA</button>
    <button class="link" id="menu">Torna ai livelli</button>
  </div>
</div>

<script>
(()=>{
/* ===== Motore condiviso: disegno, audio, voci, dialoghi, movimento ===== */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const OL='#3b2a35',TAU=Math.PI*2;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let VW,VH,DPR,Z;
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;Z=Math.max(.55,Math.min(1.25,Math.min(VW,VH)/620));}
addEventListener('resize',resize);resize();

let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const E=(c,x,y,rx,ry,rot)=>{c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);};
const C=(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,TAU);};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const fs=(c,f,lw)=>{c.fillStyle=f;c.fill();c.lineWidth=lw||3;c.strokeStyle=OL;c.stroke();};
const shadowAt=(c,x,y,rx,ry)=>{E(c,x,y,rx,ry);c.fillStyle='rgba(40,30,40,.18)';c.fill();};
const FCOL=['#ef5a6f','#6a8ff0','#b46ee0','#ff9a3d'];
function shade(h){const n=parseInt(h.slice(1),16),f=.82;return 'rgb('+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*f)).join(',')+')';}

const CATS={
  maci:{name:'MACI',body:'#2b2930',belly:'#ffffff',ear:'#f4a6b6',eye:'#e9dc6a',kind:'maci'},
  piumi:{name:'PIUMI',body:'#a2978c',belly:'#f3ece2',ear:'#f4b0b0',eye:'#f2d34a',kind:'piumi'},
  emma:{name:'NONNA EMMA',body:'#a8804f',belly:'#fff8ef',ear:'#f0b3a6',eye:'#9cc06a',kind:'emma'}
};

/* ---------- personaggi ---------- */
function drawCat(c,x,y,cat,o){
  c.save();c.translate(x,y);const s=o.scale||1;c.scale(s*(o.f||1),s);
  const t=o.t||0,mv=o.moving,bob=RM?0:(mv?Math.abs(Math.sin(t*12))*3:Math.sin(t*2)*.8);
  c.lineJoin='round';c.lineCap='round';
  if(!o.noShadow){E(c,0,0,24,7);c.fillStyle='rgba(40,30,40,.18)';c.fill();}
  const sway=RM?0:Math.sin(t*(mv?10:2.5))*6,tw=cat.kind=='piumi'?14:8;
  let tx,ty;c.beginPath();
  if(o.sit){c.moveTo(-8,-6);c.quadraticCurveTo(-32,-2,-28+sway*.3,-24);tx=-28+sway*.3;ty=-24;}
  else{c.moveTo(-14,-18);c.quadraticCurveTo(-36,-24,-30+sway,-46);tx=-30+sway;ty=-46;}
  c.strokeStyle=OL;c.lineWidth=tw+6;c.stroke();c.strokeStyle=cat.body;c.lineWidth=tw;c.stroke();
  if(cat.kind=='piumi'){c.strokeStyle='#c4b9ad';c.lineWidth=3;c.stroke();}
  if(cat.kind=='emma'){C(c,tx,ty,tw/2+1);c.fillStyle='#1e1b20';c.fill();}
  if(!o.sit){const ph=mv&&!RM?Math.sin(t*12):0;
    [[-11,ph],[11,-ph],[-4,-ph],[14,ph]].forEach(([lx,p],i)=>{const ox=lx+p*4;rr(c,ox-5,-16,10,15,5);fs(c,i<2?shade(cat.body):cat.body,2.5);
      if(cat.kind!='piumi'){E(c,ox,-3,5,3);c.fillStyle='#fff';c.fill();}});}
  if(o.sit)E(c,0,-20,18,20);else E(c,0,-17-bob*.3,20,14);
  c.fillStyle=cat.body;c.fill();
  c.save();c.clip();
  if(o.sit)E(c,5,-15,10,14);else E(c,9,-14,9,9);c.fillStyle=cat.belly;c.fill();
  if(cat.kind=='emma'){c.strokeStyle='#4a3626';c.lineWidth=3;for(let i=-16;i<12;i+=7){c.beginPath();c.moveTo(i,-40);c.lineTo(i-3,-22);c.stroke();}}
  if(cat.kind=='piumi'){c.strokeStyle='#8c8176';c.lineWidth=2;for(let i=-14;i<10;i+=6){c.beginPath();c.moveTo(i,-6);c.lineTo(i+3,-12);c.stroke();}}
  c.restore();
  if(o.sit)E(c,0,-20,18,20);else E(c,0,-17-bob*.3,20,14);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  if(o.sit){[[-6],[8]].forEach(([px])=>{E(c,px,-3,6,4);fs(c,cat.kind=='piumi'?cat.body:'#fff',2.5);});}
  const hx=6,hy=(o.sit?-46:-40)-bob;
  [[-16,-6,-12,-28,-2,-15],[4,-15,14,-28,18,-6]].forEach(a=>{c.beginPath();c.moveTo(hx+a[0],hy+a[1]);c.lineTo(hx+a[2],hy+a[3]);c.lineTo(hx+a[4],hy+a[5]);c.closePath();fs(c,cat.body);
    c.beginPath();c.moveTo(hx+a[0]*.6+a[2]*.4,hy+a[1]*.6+a[3]*.4+3);c.lineTo(hx+a[2]*.85+a[4]*.15,hy+a[3]+6);c.lineTo(hx+a[4]*.6+a[2]*.4,hy+a[5]*.6+a[3]*.4+3);c.closePath();c.fillStyle=cat.ear;c.fill();});
  if(cat.kind=='piumi'){[[-1,1],[1,1]].forEach(([d])=>{c.beginPath();const bx=hx+d*16;c.moveTo(bx,hy-2);c.lineTo(bx+d*10,hy+4);c.lineTo(bx+d*2,hy+6);c.lineTo(bx+d*8,hy+11);c.lineTo(bx-d*2,hy+12);c.closePath();fs(c,cat.body,2.5);});}
  C(c,hx,hy,18);c.fillStyle=cat.body;c.fill();
  c.save();C(c,hx,hy,18);c.clip();
  if(cat.kind=='maci'){c.beginPath();c.moveTo(hx+2,hy-19);c.lineTo(hx+7,hy+2);c.lineTo(hx-2,hy+2);c.closePath();c.fillStyle='#fff';c.fill();}
  E(c,hx+3,hy+8,11,7);c.fillStyle=cat.belly;c.fill();
  if(cat.kind=='maci'){E(c,hx+3,hy+4.5,5,2.6);c.fillStyle='#141016';c.fill();}
  if(cat.kind!='maci'){c.strokeStyle=cat.kind=='emma'?'#4a3626':'#7d7266';c.lineWidth=2.5;[-4,1,6].forEach(d=>{c.beginPath();c.moveTo(hx+d,hy-17);c.lineTo(hx+d*.7,hy-10);c.stroke();});}
  if(cat.kind=='emma'){c.strokeStyle='#4a3626';c.lineWidth=2.5;[[-18,0],[-18,5],[18,0],[18,5]].forEach(([dx,dy])=>{c.beginPath();c.moveTo(hx+dx,hy+dy);c.lineTo(hx+dx*.75,hy+dy);c.stroke();});}
  c.restore();
  C(c,hx,hy,18);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  const eyes=[[hx-5,hy-2],[hx+10,hy-2]];
  if(cat.kind=='emma'){
    eyes.forEach(([ex,ey])=>{c.beginPath();c.arc(ex,ey+2,3.8,Math.PI*1.15,Math.PI*1.85);c.strokeStyle=OL;c.lineWidth=2.5;c.stroke();
      C(c,ex,ey,7);c.strokeStyle='#d9a73a';c.lineWidth=2.5;c.stroke();});
    c.beginPath();c.moveTo(hx+2,hy-3);c.lineTo(hx+3,hy-3);c.stroke();
  }else{
    const blink=!RM&&((t+(o.seed||0)*1.7)%4.2)<.13;
    eyes.forEach(([ex,ey])=>{if(blink){c.beginPath();c.moveTo(ex-4,ey);c.lineTo(ex+4,ey);c.strokeStyle=OL;c.lineWidth=2.5;c.stroke();return;}
      E(c,ex,ey,4.8,5.8);fs(c,cat.eye,1.8);E(c,ex+.8,ey+.6,2.2,4.4);c.fillStyle='#1a1418';c.fill();C(c,ex-1.4,ey-2.2,1.7);c.fillStyle='#fff';c.fill();});
  }
  E(c,hx-10,hy+6,4,2.5);E(c,hx+16,hy+6,4,2.5);c.fillStyle='rgba(255,110,140,.5)';c.fill();
  c.beginPath();c.moveTo(hx+.5,hy+2.5);c.lineTo(hx+5.5,hy+2.5);c.lineTo(hx+3,hy+5.5);c.closePath();c.fillStyle=cat.kind=='maci'?'#141016':'#f07a8a';c.fill();
  c.beginPath();c.moveTo(hx+3,hy+5.5);c.quadraticCurveTo(hx+1,hy+9,hx-1.5,hy+8);c.moveTo(hx+3,hy+5.5);c.quadraticCurveTo(hx+5,hy+9,hx+7.5,hy+8);c.strokeStyle=cat.kind=='maci'?'#555':OL;c.lineWidth=1.6;c.stroke();
  c.strokeStyle=cat.kind=='maci'?'#e8e8e8':'rgba(255,255,255,.9)';c.lineWidth=1.2;
  [[13,4,27,1],[13,7,27,9],[-7,4,-20,1],[-7,7,-20,9]].forEach(([a,b,d,e])=>{c.beginPath();c.moveTo(hx+a,hy+b);c.lineTo(hx+d,hy+e);c.stroke();});
  c.restore();
}

function daisy(c,x,y,r,rot){for(let i=0;i<8;i++){const a=i/8*TAU+(rot||0);E(c,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.5,r*.24,a);c.fillStyle='#fff';c.fill();c.lineWidth=1.4;c.strokeStyle=OL;c.stroke();}
  C(c,x,y,r*.36);fs(c,'#f6c830',1.4);}

function drawGirl(c,x,y,o){
  c.save();c.translate(x,y);c.lineJoin='round';c.lineCap='round';const t=o.t||0,SK='#f8d5bd',HR='#6b4226';
  if(!o.noShadow){E(c,0,0,22,6);c.fillStyle='rgba(40,30,40,.18)';c.fill();}
  rr(c,-9,-40,7,37,3);fs(c,SK,2.5);rr(c,2,-40,7,37,3);fs(c,SK,2.5);
  E(c,-6,-3,7,4);fs(c,'#e85a5a',2.5);E(c,6,-3,7,4);fs(c,'#e85a5a',2.5);
  rr(c,-12,-52,24,15,4);fs(c,'#5a7fc0',2.5);
  const wave=o.wave&&!RM?Math.sin(t*7)*6:0;
  const arm=(x1,y1,x2,y2)=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=OL;c.lineWidth=10;c.stroke();c.strokeStyle=SK;c.lineWidth=6;c.stroke();};
  arm(-11,-80,-17,-52);
  if(o.wave)arm(11,-80,22+wave,-100);else arm(11,-80,17,-52);
  rr(c,-13,-84,26,36,7);fs(c,'#5cbf60',2.8);
  c.save();rr(c,-13,-84,26,36,7);c.clip();c.fillStyle='#48a04c';c.fillRect(5,-84,10,36);c.restore();rr(c,-13,-84,26,36,7);c.lineWidth=2.8;c.strokeStyle=OL;c.stroke();
  daisy(c,0,-67,7);
  rr(c,-3,-90,6,8,2);c.fillStyle=SK;c.fill();
  c.beginPath();c.moveTo(-21,-89);c.lineTo(-21,-104);c.arc(0,-104,21,Math.PI,0);c.lineTo(21,-89);c.lineTo(11,-89);c.lineTo(7,-97);c.lineTo(-7,-97);c.lineTo(-11,-89);c.closePath();fs(c,HR,2.8);
  c.strokeStyle='#9a6a40';c.lineWidth=1.6;[[-17,-100,-17,-91],[17,-100,17,-91]].forEach(([a,b,d,e])=>{c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke();});
  C(c,0,-102,15);fs(c,SK,2.8);
  c.beginPath();c.moveTo(-16,-101);c.quadraticCurveTo(-17,-121,0,-121);c.quadraticCurveTo(17,-121,16,-101);c.quadraticCurveTo(9,-110,3,-106);c.quadraticCurveTo(-6,-112,-16,-101);fs(c,HR,2.5);
  c.beginPath();c.moveTo(-8,-116);c.quadraticCurveTo(0,-120,7,-117);c.strokeStyle='#9a6a40';c.lineWidth=2;c.stroke();
  [[-5.5],[5.5]].forEach(([ex])=>{E(c,ex,-99,2.4,3.2);c.fillStyle='#2b2026';c.fill();C(c,ex-.8,-100.3,.9);c.fillStyle='#fff';c.fill();});
  E(c,-9,-94,3.4,2);E(c,9,-94,3.4,2);c.fillStyle='rgba(255,110,140,.5)';c.fill();
  c.beginPath();c.arc(0,-96,4,.2*Math.PI,.8*Math.PI);c.strokeStyle='#b04650';c.lineWidth=1.8;c.stroke();
  if(o.crown){for(let i=0;i<7;i++){const a=Math.PI*(1.08+i*.14);daisy(c,Math.cos(a)*16,-104+Math.sin(a)*15,5,i);}}
  else daisy(c,12,-113,4.5);
  c.restore();
}

/* nonno Gian e nonna Luisa, nonno Gianco e nonna Lucy */
const PEOPLE={
  gian:{shirt:'#a9cdea',stripe:'#ffffff',pants:'#2f3a5a',hair:'#f4f4f4',skin:'#f3c9a8',shoes:'#3a2a2a'},
  luisa:{shirt:'#26365e',pants:'#8d7a66',hair:'#e3d2b0',skin:'#f6d3b8',shoes:'#5a3a2a'},
  gianco:{shirt:'#2c3b63',inner:'#bcd7f0',tie:'#3d63a8',pants:'#4a4f5c',hair:'#e8e6e2',skin:'#efc3a0',shoes:'#2a2222'},

/* ---------- aggiornamento ---------- */
function camera(){const vw=VW/Z,vh=VH/Z;
  let x=S.p.x-vw/2,y=S.p.y-vh/2-20;
  x=vw>=L.ww?(L.ww-vw)/2:Math.max(0,Math.min(L.ww-vw,x));
  y=vh>=L.wh?(L.wh-vh)/2:Math.max(0,Math.min(L.wh-vh,y));return{x,y};}
function update(dt){
  T+=dt;hintCD-=dt;
  if(L.tick)L.tick(dt);
  floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.8);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt;p.rot+=dt*6;});parts=parts.filter(p=>p.life>0);
  if(endTimer>0){endTimer-=dt;if(endTimer<=0)showEnd();}
  const p=S.p;let dx=0,dy=0;
  if(S.started&&!dlg&&!S.done){
    if(keys.arrowleft||keys.a)dx-=1;if(keys.arrowright||keys.d)dx+=1;if(keys.arrowup||keys.w)dy-=1;if(keys.arrowdown||keys.s)dy+=1;
    if(dx||dy)target=null;
    else if(target){const ex=target.x-p.x,ey=target.y-p.y,d=Math.hypot(ex,ey);if(d>6){dx=ex/d;dy=ey/d;}else target=null;}
  }
  const len=Math.hypot(dx,dy);p.moving=len>0;
  if(len){dx/=len;dy/=len;const sp=180*dt;const nx=p.x+dx*sp,ny=p.y+dy*sp;let moved=false;
    if(!L.blocked(nx,p.y)){p.x=nx;moved=true;}if(!L.blocked(p.x,ny)){p.y=ny;moved=true;}
    if(!moved){target=null;p.moving=false;}
    if(Math.abs(dx)>.15)p.f=dx>0?1:-1;
    const last=trail[trail.length-1];if(!last||Math.hypot(last.x-p.x,last.y-p.y)>4)trail.push({x:p.x,y:p.y});if(trail.length>60)trail.shift();}
  if(L.party.length>1){const q=S.q,tgt=trail.length>9?trail[trail.length-9]:null;
    if(tgt&&Math.hypot(tgt.x-q.x,tgt.y-q.y)>2){const ex=tgt.x-q.x,ey=tgt.y-q.y,d=Math.hypot(ex,ey),st=Math.min(d,190*dt);q.x+=ex/d*st;q.y+=ey/d*st;q.moving=true;if(Math.abs(ex)>1)q.f=ex>0?1:-1;}else q.moving=false;}
  if(!S.started||dlg||S.done)return;
  L.update(dt);
}

/* ---------- disegno ---------- */
function render(){
  const cam=camera(),c=ctx;
  c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle=L.bg;c.fillRect(0,0,VW,VH);
  c.setTransform(DPR*Z,0,0,DPR*Z,-cam.x*DPR*Z,-cam.y*DPR*Z);
  c.lineCap='round';c.lineJoin='round';
  L.drawBack(c);
  const ents=[];L.ents(c,ents);
  if(L.party.length>1)ents.push([S.q.y,()=>drawCat(c,S.q.x,S.q.y,CATS[other()],{f:S.q.f,t:T,moving:S.q.moving,seed:2})]);
  ents.push([S.p.y,()=>{drawCat(c,S.p.x,S.p.y,CATS[S.cur],{f:S.p.f,t:T,moving:S.p.moving,seed:1});if(L.carry)L.carry(c,S.p.x,S.p.y);}]);
  ents.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]());
  if(L.drawFront)L.drawFront(c);
  if(target&&S.started){E(c,target.x,target.y,14,6);c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=3;c.stroke();}
  parts.forEach(p=>{c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.min(1,p.life*1.5);c.fillStyle=p.col;c.fillRect(-p.r,-p.r/2,p.r*2,p.r);c.restore();});
  c.textAlign='center';c.font='700 24px Fredoka, "Trebuchet MS", sans-serif';c.lineJoin='round';
  floats.forEach(f=>{const a=Math.max(0,1-Math.max(0,f.t-1)/.8);c.globalAlpha=a;const y=f.y-f.t*26;c.lineWidth=6;c.strokeStyle=OL;c.strokeText(f.txt,f.x,y);c.fillStyle=f.col;c.fillText(f.txt,f.x,y);});
  c.globalAlpha=1;
  const g=S.started&&!S.done?L.guide():null;
  if(g&&!dlg){
    c.setTransform(DPR,0,0,DPR,0,0);
    let sx=(g.x-cam.x)*Z,sy=(g.y-cam.y)*Z;const m=56,top=110;
    const inside=sx>m&&sx<VW-m&&sy>top&&sy<VH-m;
    let ang=Math.PI/2;
    if(!inside){const cx=VW/2,cy=VH/2;ang=Math.atan2(sy-cy,sx-cx);sx=Math.max(m,Math.min(VW-m,sx));sy=Math.max(top,Math.min(VH-m,sy));}
    else sy+=RM?0:Math.sin(T*6)*6-6;
    c.save();c.translate(sx,sy);c.rotate(ang);c.beginPath();c.moveTo(16,0);c.lineTo(-10,-14);c.lineTo(-4,0);c.lineTo(-10,14);c.closePath();
    c.fillStyle='#ffc93d';c.fill();c.lineWidth=3.5;c.strokeStyle=OL;c.lineJoin='round';c.stroke();c.restore();
  }
}

  fresh(){const items=['nastro','chiocciola','sasso','vuoto'].sort(()=>Math.random()-.5);

  progress:()=>S.state>=1?[0,1,2].map(i=>daisySVG(i<S.count)).join(''):'',

    if(x<55||x>WW-55||y<75||y>WH-38)return true;

  c.beginPath();c.moveTo(bx-64,y-20);c.lineTo(bx+64,y-20);c.strokeStyle=OL;c.lineWidth=8;c.stroke();c.strokeStyle='#d99a62';c.lineWidth=4;c.stroke();
  [-60,-20,20,60].forEach(d=>{rr(c,bx+d-5,y-28,10,30,3);fs(c,'#b0743f',2.5);});
}
function drawBench(c){
  const {x,y}=BENCH;
  rr(c,x-56,y-80,10,62,3);fs(c,'#8a5230',2.5);rr(c,x+46,y-80,10,62,3);fs(c,'#8a5230',2.5);
  rr(c,x-64,y-82,128,12,4);fs(c,'#b0743f');rr(c,x-64,y-64,128,10,4);fs(c,'#b0743f');
  rr(c,x-56,y-24,10,24,3);fs(c,'#8a5230',2.5);rr(c,x+46,y-24,10,24,3);fs(c,'#8a5230',2.5);
  rr(c,x-64,y-36,128,14,4);fs(c,'#c48a55');
}
function drawPicnic(c){
  const x=240,y=598,w=180,h=56;
  shadowAt(c,TABLE.x,y+h+30,110,12);
  rr(c,x+16,y+h-4,12,32,3);fs(c,'#8a5230',2.5);rr(c,x+w-28,y+h-4,12,32,3);fs(c,'#8a5230',2.5);
  rr(c,x,y,w,h,8);fs(c,'#c98b55');
  c.save();rr(c,x+26,y+4,w-52,h-6,4);c.clip();c.fillStyle='#fff';c.fillRect(x,y,w,h);c.fillStyle='rgba(229,83,61,.55)';
  for(let k=0;k<w;k+=14){c.fillRect(x+26+k,y,7,h);}for(let k=0;k<h;k+=14){c.fillRect(x,y+4+k,w,7);}c.restore();
  rr(c,x+26,y+4,w-52,h-6,4);c.lineWidth=2;c.strokeStyle=OL;c.stroke();
  rr(c,x,y+h-6,w,14,5);fs(c,'#a86a40');
  if(S.state>=6){
    E(c,330,628,34,10);fs(c,'#fff',2.2);
    rr(c,302,596,56,28,8);fs(c,'#f2d0a0',2.5);E(c,330,598,28,8);fs(c,'#5a4fa8',2.2);
    [[-14,-1],[-4,1],[6,-2],[16,0],[0,-4],[10,3],[-10,3]].forEach(([a,b])=>{C(c,330+a,598+b,2.6);c.fillStyle='#8f86e0';c.fill();});
  }
  if(S.merenda)[[268,618],[392,618]].forEach(([a,b])=>{E(c,a,b,12,4);fs(c,'#fff',1.8);rr(c,a-7,b-15,14,13,4);fs(c,'#fff',1.8);c.fillStyle='#4f8fd8';c.fillRect(a-7,b-11,14,3);});
}
function seat(c,y){rr(c,250,y,160,14,4);fs(c,'#b0743f');rr(c,262,y+12,10,16,2);fs(c,'#8a5230',2);rr(c,388,y+12,10,16,2);fs(c,'#8a5230',2);}
function drawHat(c,h){
  const fly=S.state==4,lift=fly?(RM?22:20+Math.abs(Math.sin(T*3))*16):4;
  shadowAt(c,h.x,h.y,fly?14:18,5);
  c.save();c.translate(h.x,h.y-lift);if(fly&&!RM)c.rotate(Math.sin(T*4)*.3+h.vx*.0015);alpineHat(c,0,0,1.15);c.restore();
}
function moo(){tone(150,.45,0,'sawtooth');tone(118,.5,.3,'sawtooth');tone(1240,.25,.05,'sine');}

function wallBlocked(x,y){
  if(x<45||x>WW-45||y<272||y>WH-40)return true;
  if(x>CHALET.x-8&&x<CHALET.x+CHALET.w+8&&y<CHALET.y+CHALET.h+16)return true;
  if(x>860&&y<394)return true;
  if(Math.abs(x-sx(y))<46&&!(y>BRIDGE.y1+4&&y<BRIDGE.y2-2))return true;
  if(x>236&&x<424&&y>584&&y<692)return true;
  if(x>932&&x<1068&&y>490&&y<550)return true;
  for(const [px,py] of PINES)if(Math.hypot(x-px,y-py)<24)return true;
  for(const [bx,by] of BERRY_POS)if(Math.hypot(x-bx,y-by)<24)return true;
  return false;
}
const hatBlocked=(x,y)=>x<760||y<404||wallBlocked(x,y);

function talkLucy(){
  const s=S.state;
  if(s==0)openDialog('lucy',[`CIAO ${N()}!`,'FACCIAMO UNA TORTA DI MIRTILLI.','RACCOGLI 3 MIRTILLI!'],()=>setState(1));
  else if(s==1)openDialog('lucy',['CERCA I CESPUGLI BLU!']);
  else if(s==2)openDialog('lucy',['CHE BEI MIRTILLI!',`GRAZIE ${N()}!`,'VAI DAL NONNO GIANCO.'],()=>{sfx.pick();burst(S.npc.lucy.x,S.npc.lucy.y-110,24,['#4a4fb8','#fff','#ffc93d']);setState(3);});
  else if(s<6)openDialog('lucy',['LA TORTA È NEL FORNO.','VAI DAL NONNO GIANCO.']);
}
function talkGianco(){
  const s=S.state;
  if(s<3)openDialog('gianco',[`CIAO ${N()}!`,'VAI DALLA NONNA LUCY.']);
  else if(s==3)openDialog('gianco',[`CIAO ${N()}!`,'IL VENTO HA PRESO IL MIO CAPPELLO!','MI AIUTI A PRENDERLO?'],()=>setState(4));
  else if(s==4)openDialog('gianco',[`CORRI, ${N()}!`]);
  else if(s==5)openDialog('gianco',['IL MIO CAPPELLO!',`GRAZIE ${N()}!`,'LA TORTA È PRONTA!'],()=>{
    S.gianHat=true;sfx.pick();burst(BENCH.x,BENCH.y-130,24,['#4f7d3c','#fff','#ffc93d']);setState(6);
    const bx=sx(563),n=S.npc;
    n.gianco.path=[[bx+80,563],[bx-80,563],[452,646]];
    n.lucy.path=[[205,646]];
    n.girl.path=[[200,560],[330,566]];
    floatText(TABLE.x,TABLE.y-130,'TUTTI A MERENDA!','#ffe9a8');});
}
function talkGirl(){
  if(S.state<6)openDialog('girl',[`CIAO ${N()}!`,'AIUTA I NONNI!']);
}
function merenda(){
  openDialog('lucy',['ECCO LA TORTA DI MIRTILLI!',`${BRAV()} ${N()}!`],()=>{
    S.merenda=true;setState(7);sfx.win();confetti(TABLE.x,TABLE.y-80);floatText(TABLE.x,TABLE.y-130,'MERENDA!','#ffc93d');
    finish('Che buona la torta di mirtilli in montagna!',2.6);});
}

LEVELS.push({
  name:'In montagna dai nonni',ww:WW,wh:WH,bg:'#9ad66f',party:['maci','piumi'],music:'audio/stage3.mp3',
  start:{p:{x:480,y:440},q:{x:440,y:456}},
  quests:['VAI DA NONNA LUCY','RACCOGLI 3 MIRTILLI','PORTA I MIRTILLI ALLA NONNA','VAI DA NONNO GIANCO','PRENDI IL CAPPELLO DEL NONNO','PORTA IL CAPPELLO AL NONNO','TUTTI A MERENDA!','MERENDA!'],
  fresh:()=>({count:0,berries:BERRY_POS.map(([x,y])=>({x,y,got:false})),gianHat:false,merenda:false,
    hat:{x:900,y:720,vx:0,vy:0},
    npc:{lucy:{x:250,y:420,path:[]},gianco:{x:BENCH.x,y:BENCH.y+1,path:[]},girl:{x:170,y:745,path:[]}}}),
  progress:()=>S.state>=1&&S.state<=2?[0,1,2].map(i=>berrySVG(i<S.count)).join(''):'',
  blocked(x,y){
    if(wallBlocked(x,y))return true;
    const n=S.npc;return Math.hypot(x-n.lucy.x,y-n.lucy.y)<26||Math.hypot(x-n.girl.x,y-n.girl.y)<22||(S.state>=6&&Math.hypot(x-n.gianco.x,y-n.gianco.y)<26);
  },
  tick(dt){
    Object.values(S.npc).forEach(n=>{if(!n.path.length)return;const [tx,ty]=n.path[0],d=Math.hypot(tx-n.x,ty-n.y),st=150*dt;
      if(d<=st){n.x=tx;n.y=ty;n.path.shift();}else{n.x+=(tx-n.x)/d*st;n.y+=(ty-n.y)/d*st;}});
  },
  update(dt){
    const p=S.p,s=S.state;
    S.berries.forEach(b=>{if(b.got||Math.hypot(b.x-p.x,b.y-p.y)>48)return;
      if(s<1){if(hintCD<=0){floatText(b.x,b.y-70,'PRIMA VAI DA NONNA LUCY','#ffe9a8');hintCD=2.5;}return;}
      if(s>1)return;
      b.got=true;S.count++;sfx.pick();burst(b.x,b.y-24,22,['#4a4fb8','#8f86e0','#fff']);floatText(b.x,b.y-70,S.count+(S.count==1?' MIRTILLO!':' MIRTILLI!'));
      if(S.count>=3){floatText(p.x,p.y-90,BRAV()+'!','#ffc93d');setState(2);}else updateHUD();});
    if(s==4){const h=S.hat,d=Math.hypot(h.x-p.x,h.y-p.y)||1;let tvx=h.vx*.9,tvy=h.vy*.9;
      if(d<190){const ax=(h.x-p.x)/d,ay=(h.y-p.y)/d,w=Math.sin(T*1.9)*.8;tvx=(ax-ay*w)*125;tvy=(ay+ax*w)*125;}
      const k=Math.min(1,dt*4);h.vx+=(tvx-h.vx)*k;h.vy+=(tvy-h.vy)*k;
      const nx=h.x+h.vx*dt,ny=h.y+h.vy*dt;
      if(hatBlocked(nx,h.y))h.vx*=-.9;else h.x=nx;
      if(hatBlocked(h.x,ny))h.vy*=-.9;else h.y=ny;
      if(d<34){S.carry='cappello';sfx.pick();burst(h.x,h.y-24,24,['#4f7d3c','#fff','#ffc93d']);floatText(h.x,h.y-70,'PRESO!','#ffc93d');setState(5);}}
    if(s==6){proximity('table',TABLE.x,TABLE.y,merenda,150);return;}
    proximity('lucy',S.npc.lucy.x,S.npc.lucy.y,talkLucy);
    proximity('gianco',GIANCO_TALK.x,GIANCO_TALK.y,talkGianco,75);
    proximity('girl',S.npc.girl.x,S.npc.girl.y,talkGirl);
    proximity('cow',1000,400,()=>{moo();floatText(1000,240,'MUUU!','#fff');},60);
  },
  guide(){
    const s=S.state,n=S.npc;
    if(s==0||s==2)return{x:n.lucy.x,y:n.lucy.y-150};
    if(s==1)return nearest(S.berries.filter(b=>!b.got),70);
    if(s==3||s==5)return{x:BENCH.x,y:BENCH.y-150};
    if(s==4)return{x:S.hat.x,y:S.hat.y-60};
    if(s==6)return{x:TABLE.x,y:TABLE.y-120};
    return null;
  },
  carry(c,x,y){const b=RM?0:Math.sin(T*5)*3;if(S.state==2)drawBerries(c,x+6,y-84-b);else if(S.carry=='cappello'&&S.state==5)alpineHat(c,x+6,y-82-b,1);},
  drawBack(c){
    drawSky(c);
    c.fillStyle='#9ad66f';c.fillRect(0,252,WW,WH-252);
    drawStream(c);drawHills(c);
    c.strokeStyle='#7fbf55';c.lineWidth=2;tufts.forEach(([x,y])=>{c.beginPath();c.moveTo(x-4,y-5);c.lineTo(x,y);c.lineTo(x+4,y-6);c.stroke();});
    flowers.forEach(([x,y,k])=>drawFlower(c,x,y,k));
    c.beginPath();c.moveTo(250,368);c.quadraticCurveTo(300,470,480,470);c.quadraticCurveTo(560,470,sx(563)-60,563);c.strokeStyle='#d8c08a';c.lineWidth=34;c.stroke();
    c.beginPath();c.moveTo(sx(563)+60,563);c.quadraticCurveTo(880,563,940,590);c.stroke();
  },
  ents(c,ents){
    const n=S.npc;
    ents.push([CHALET.y+CHALET.h,()=>drawChalet(c)]);
    PINES.forEach(([x,y])=>ents.push([y,()=>drawPine(c,x,y)]));
    COWS.forEach(([x,y,f,k])=>ents.push([y,()=>drawCow(c,x,y,f,k)]));
    ents.push([376,()=>drawFence(c)]);ents.push([300,()=>drawSideFence(c)]);
    ents.push([BRIDGE.y1,()=>drawBridge(c)]);ents.push([BRIDGE.y2+4,()=>railing(c,sx(563),BRIDGE.y2+4)]);
    S.berries.forEach(b=>ents.push([b.y,()=>drawBush(c,b)]));
    ents.push([588,()=>seat(c,574)]);ents.push([668,()=>drawPicnic(c)]);ents.push([690,()=>seat(c,672)]);
    if(S.state<6){ents.push([BENCH.y-10,()=>drawBench(c)]);ents.push([n.gianco.y,()=>drawPerson(c,n.gianco.x,n.gianco.y,{kind:'gianco',sit:true,t:T,wave:S.state==3})]);}
    else ents.push([n.gianco.y,()=>drawPerson(c,n.gianco.x,n.gianco.y,{kind:'gianco',hat:true,t:T,wave:S.state>=7})]);
    if(S.state>=6)ents.push([BENCH.y-10,()=>drawBench(c)]);
    ents.push([n.lucy.y,()=>drawPerson(c,n.lucy.x,n.lucy.y,{kind:'lucy',t:T,wave:S.state==0||S.state>=7})]);
    ents.push([n.girl.y,()=>drawGirl(c,n.girl.x,n.girl.y,{t:T,wave:S.state>=6})]);
    if(S.state<5)ents.push([S.hat.y,()=>drawHat(c,S.hat)]);
  },
  drawFront(c){
    if(S.state==1)S.berries.forEach((b,i)=>{if(!b.got)sparkle(c,b.x+22,b.y-52,i*.37);});
  }
});
})();

/* ===== Avvio ===== */
const lv=document.getElementById('levels');
lv.innerHTML=LEVELS.map((l,i)=>`<button class="lvl" data-l="${i}"><b>${i+1}</b><span>${l.name}</span></button>`).join('');
lv.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>play(+b.dataset.l));
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
function start(data){
  if(data&&data.S&&LEVELS[data.S.lvl]){S=data.S;L=LEVELS[S.lvl];music.src=L.music;updateHUD();drawPortraits();if(S.started)document.getElementById('start').hidden=true;}
  else startLevel(0);
  document.getElementById('bMus').classList.toggle('on',musicOn);
  requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawPortraits);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
if(location.hash=='#debug')window.__gioco={get S(){return S;},setState,play};

})();
</script>
