<title>Maci e Piumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen canvas world, storybook HUD panels pinned to the corners, parchment dialog at the bottom */
:root{
  --ink:#3b2a35; --paper:#fff4dc; --paper-2:#f3dcae; --red:#e5533d; --gold:#ffc93d;
  --leaf:#4caf50; --leaf-dark:#2f8a3a; --grass:#6aa94b; --muted:#8a6f60;
  --display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font-family:var(--display);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.quest{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px 10px;max-width:min(360px,calc(100% - 320px));display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;background:var(--red);color:#fff;font-weight:600;font-size:13px;letter-spacing:.08em;padding:2px 10px;border-radius:99px;border:2px solid var(--ink)}
#questText{font-weight:700;font-size:clamp(17px,2.6vw,24px);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
#questProg{display:flex;gap:6px}
#questProg svg{width:26px;height:26px}
.party{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 6px 6px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:13px;letter-spacing:.05em;transition:transform .12s}
.pc canvas{width:52px;height:52px}
.pc.on{background:var(--gold);transform:translateY(-2px)}
.pc.mus svg{width:52px;height:52px;padding:8px;box-sizing:border-box}
.pc.mus.on{background:var(--paper-2);transform:none}
.pc.mus.on .x{display:none}
.pc:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 24px));box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px 14px}
.pic{flex:none;width:92px;height:92px;border-radius:50%;background:#bfe3a5;border:3px solid var(--ink);overflow:hidden}
.pic canvas{width:100%;height:100%}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dname{align-self:flex-start;background:var(--gold);border:2px solid var(--ink);border-radius:99px;padding:1px 10px;font-weight:600;font-size:14px;letter-spacing:.06em}
.dtext{font-weight:700;font-size:clamp(20px,3.6vw,30px);line-height:1.15;letter-spacing:.02em}
.dbtns{display:flex;flex-direction:column;gap:8px}
.btn{border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:20px;padding:8px 16px;background:var(--leaf);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper-2);color:var(--ink);padding:6px 10px;display:grid;place-items:center}
.btn.ghost svg{width:26px;height:26px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,25,45,.35);padding:16px}
.card{position:relative;text-align:center;padding:30px 28px 26px;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ribbon{position:absolute;top:-18px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 16px;font-weight:700;letter-spacing:.12em;font-size:15px}
.card h1{margin:4px 0 0;font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.02;text-wrap:balance;color:var(--ink)}
.card h1 em{font-style:normal;color:var(--red)}
.card p{margin:0;font-size:17px;color:var(--muted);font-weight:500;max-width:32ch}
.card .btn{font-size:26px;padding:10px 34px;background:#f28c28;margin-top:8px}
.levels{display:grid;gap:10px;width:100%;margin-top:6px}
.lvl{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);text-align:left}
.lvl:hover{background:var(--gold)}
.lvl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lvl b{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#f28c28;color:#fff;border:3px solid var(--ink);font-size:22px}
.lvl span{font-weight:600;font-size:19px;line-height:1.1}
.card .btn.alt{background:var(--leaf);font-size:20px;padding:8px 24px;margin-top:0}
.link{background:none;border:0;font-weight:600;font-size:15px;color:var(--muted);text-decoration:underline;padding:4px}
.stars{display:flex;gap:6px}
.stars svg{width:52px;height:52px}
@media (max-width:520px){.pic{width:64px;height:64px}.dialog{gap:10px;padding:10px}.btn{font-size:18px;padding:6px 12px}.pc canvas,.pc.mus svg{width:42px;height:42px}.quest{max-width:calc(100% - 270px)}.party{gap:6px}}
body.menu .quest,body.menu #bBack,body.menu #bMaci,body.menu #bPiumi{display:none}
body.menu .party{z-index:2}
#start{background:rgba(40,25,45,.12);place-items:start center;padding-top:max(28px,4vh);overflow:auto}
#start .card{max-width:600px;padding:26px 22px 20px}
#start .levels{grid-template-columns:1fr 1fr}#start .lvl:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;min-width:50%}
@media (max-width:639px){#start{padding-top:calc(78px + env(safe-area-inset-top,0px))}#start .card{padding:22px 12px 14px;gap:6px}#start .card p{display:none}#start .card h1{font-size:30px}#start .levels{gap:8px}#start .lvl{gap:8px;padding:7px 8px}#start .lvl b{width:30px;height:30px;font-size:17px}#start .lvl span{font-size:15px}}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>

<canvas id="game" aria-label="Il gioco"></canvas>

<div class="quest panel" id="quest" aria-live="polite">
  <span class="tag">MISSIONE</span>
  <div id="questText">VAI DA NONNA EMMA</div>
  <div id="questProg"></div>
</div>

<div class="party">
  <button class="pc mus" id="bBack" aria-label="Torna ai livelli"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>LIVELLI</button>
  <button class="pc on" id="bMaci" aria-label="Gioca con Maci"><canvas width="104" height="104"></canvas>MACI</button>
  <button class="pc" id="bPiumi" aria-label="Gioca con Piumi"><canvas width="104" height="104"></canvas>PIUMI</button>
  <button class="pc mus on" id="bMus" aria-label="Accendi o spegni la musica" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="currentColor"/><circle cx="17.5" cy="16" r="3" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="#e5533d" stroke-width="3" stroke-linecap="round"/></svg>MUSICA</button>
</div>

<div class="dialog panel" id="dlg" hidden>
  <div class="pic"><canvas id="dlgPic" width="184" height="184"></canvas></div>
  <div class="dbody"><span class="dname" id="dName"></span><div class="dtext" id="dText"></div></div>
  <div class="dbtns">
    <button class="btn ghost" id="dSay" aria-label="Ascolta la frase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="btn" id="dOk">OK</button>
  </div>
</div>

<div class="overlay" id="start">
  <div class="card panel">
    <span class="ribbon">SCEGLI IL LIVELLO</span>
    <h1><em>Maci</em> e <em>Piumi</em></h1>
    <p>Tocca il pavimento o il prato per far camminare il gatto. Sul computer puoi usare le frecce.</p>
    <div class="levels" id="levels"></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card panel">
    <span class="ribbon" id="endRibbon">LIVELLO COMPLETATO</span>
    <div class="stars" id="stars"></div>
    <h1>MIAO&#8209;RAVIGLIOSO!</h1>
    <p id="endText"></p>
    <button class="btn" id="next">LIVELLO 2</button>
    <button class="btn alt" id="again">GIOCA ANCORA</button>
    <button class="link" id="menu">Torna ai livelli</button>
  </div>
</div>

<script>
(()=>{
/* ===== Motore condiviso: disegno, audio, voci, dialoghi, movimento ===== */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const OL='#3b2a35',TAU=Math.PI*2;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let VW,VH,DPR,Z;
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;Z=Math.max(.55,Math.min(1.25,Math.min(VW,VH)/620));}
addEventListener('resize',resize);resize();

let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const E=(c,x,y,rx,ry,rot)=>{c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);};
const C=(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,TAU);};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const fs=(c,f,lw)=>{c.fillStyle=f;c.fill();c.lineWidth=lw||3;c.strokeStyle=OL;c.stroke();};
const shadowAt=(c,x,y,rx,ry)=>{E(c,x,y,rx,ry);c.fillStyle='rgba(40,30,40,.18)';c.fill();};
const FCOL=['#ef5a6f','#6a8ff0','#b46ee0','#ff9a3d'];
function shade(h){const n=parseInt(h.slice(1),16),f=.82;return 'rgb('+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*f)).join(',')+')';}

const CATS={
  maci:{name:'MACI',body:'#2b2930',belly:'#ffffff',ear:'#f4a6b6',eye:'#e9dc6a',kind:'maci'},
  piumi:{name:'PIUMI',body:'#a2978c',belly:'#f3ece2',ear:'#f4b0b0',eye:'#f2d34a',kind:'piumi'},
  emma:{name:'NONNA EMMA',body:'#a8804f',belly:'#fff8ef',ear:'#f0b3a6',eye:'#9cc06a',kind:'emma'}
};

/* ---------- personaggi ---------- */
function drawCat(c,x,y,cat,o){
  c.save();c.translate(x,y);const s=o.scale||1;c.scale(s*(o.f||1),s);
  const t=o.t||0,mv=o.moving,bob=RM?0:(mv?Math.abs(Math.sin(t*12))*3:Math.sin(t*2)*.8);
  c.lineJoin='round';c.lineCap='round';
  if(!o.noShadow){E(c,0,0,24,7);c.fillStyle='rgba(40,30,40,.18)';c.fill();}
  const sway=RM?0:Math.sin(t*(mv?10:2.5))*6,tw=cat.kind=='piumi'?14:8;
  let tx,ty;c.beginPath();
  if(o.sit){c.moveTo(-8,-6);c.quadraticCurveTo(-32,-2,-28+sway*.3,-24);tx=-28+sway*.3;ty=-24;}
  else{c.moveTo(-14,-18);c.quadraticCurveTo(-36,-24,-30+sway,-46);tx=-30+sway;ty=-46;}
  c.strokeStyle=OL;c.lineWidth=tw+6;c.stroke();c.strokeStyle=cat.body;c.lineWidth=tw;c.stroke();
  if(cat.kind=='piumi'){c.strokeStyle='#c4b9ad';c.lineWidth=3;c.stroke();}
  if(cat.kind=='emma'){C(c,tx,ty,tw/2+1);c.fillStyle='#1e1b20';c.fill();}
  if(!o.sit){const ph=mv&&!RM?Math.sin(t*12):0;
    [[-11,ph],[11,-ph],[-4,-ph],[14,ph]].forEach(([lx,p],i)=>{const ox=lx+p*4;rr(c,ox-5,-16,10,15,5);fs(c,i<2?shade(cat.body):cat.body,2.5);
      if(cat.kind!='piumi'){E(c,ox,-3,5,3);c.fillStyle='#fff';c.fill();}});}
  if(o.sit)E(c,0,-20,18,20);else E(c,0,-17-bob*.3,20,14);
  c.fillStyle=cat.body;c.fill();
  c.save();c.clip();
  if(o.sit)E(c,5,-15,10,14);else E(c,9,-14,9,9);c.fillStyle=cat.belly;c.fill();
  if(cat.kind=='emma'){c.strokeStyle='#4a3626';c.lineWidth=3;for(let i=-16;i<12;i+=7){c.beginPath();c.moveTo(i,-40);c.lineTo(i-3,-22);c.stroke();}}
  if(cat.kind=='piumi'){c.strokeStyle='#8c8176';c.lineWidth=2;for(let i=-14;i<10;i+=6){c.beginPath();c.moveTo(i,-6);c.lineTo(i+3,-12);c.stroke();}}
  c.restore();
  if(o.sit)E(c,0,-20,18,20);else E(c,0,-17-bob*.3,20,14);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  if(o.sit){[[-6],[8]].forEach(([px])=>{E(c,px,-3,6,4);fs(c,cat.kind=='piumi'?cat.body:'#fff',2.5);});}
  const hx=6,hy=(o.sit?-46:-40)-bob;
  [[-16,-6,-12,-28,-2,-15],[4,-15,14,-28,18,-6]].forEach(a=>{c.beginPath();c.moveTo(hx+a[0],hy+a[1]);c.lineTo(hx+a[2],hy+a[3]);c.lineTo(hx+a[4],hy+a[5]);c.closePath();fs(c,cat.body);
    c.beginPath();c.moveTo(hx+a[0]*.6+a[2]*.4,hy+a[1]*.6+a[3]*.4+3);c.lineTo(hx+a[2]*.85+a[4]*.15,hy+a[3]+6);c.lineTo(hx+a[4]*.6+a[2]*.4,hy+a[5]*.6+a[3]*.4+3);c.closePath();c.fillStyle=cat.ear;c.fill();});
  if(cat.kind=='piumi'){[[-1,1],[1,1]].forEach(([d])=>{c.beginPath();const bx=hx+d*16;c.moveTo(bx,hy-2);c.lineTo(bx+d*10,hy+4);c.lineTo(bx+d*2,hy+6);c.lineTo(bx+d*8,hy+11);c.lineTo(bx-d*2,hy+12);c.closePath();fs(c,cat.body,2.5);});}
  C(c,hx,hy,18);c.fillStyle=cat.body;c.fill();
  c.save();C(c,hx,hy,18);c.clip();
  if(cat.kind=='maci'){c.beginPath();c.moveTo(hx+2,hy-19);c.lineTo(hx+7,hy+2);c.lineTo(hx-2,hy+2);c.closePath();c.fillStyle='#fff';c.fill();}
  E(c,hx+3,hy+8,11,7);c.fillStyle=cat.belly;c.fill();
  if(cat.kind=='maci'){E(c,hx+3,hy+4.5,5,2.6);c.fillStyle='#141016';c.fill();}
  if(cat.kind!='maci'){c.strokeStyle=cat.kind=='emma'?'#4a3626':'#7d7266';c.lineWidth=2.5;[-4,1,6].forEach(d=>{c.beginPath();c.moveTo(hx+d,hy-17);c.lineTo(hx+d*.7,hy-10);c.stroke();});}
  if(cat.kind=='emma'){c.strokeStyle='#4a3626';c.lineWidth=2.5;[[-18,0],[-18,5],[18,0],[18,5]].forEach(([dx,dy])=>{c.beginPath();c.moveTo(hx+dx,hy+dy);c.lineTo(hx+dx*.75,hy+dy);c.stroke();});}
  c.restore();
  C(c,hx,hy,18);c.lineWidth=3;c.strokeStyle=OL;c.stroke();
  const eyes=[[hx-5,hy-2],[hx+10,hy-2]];
  if(cat.kind=='emma'){
    eyes.forEach(([ex,ey])=>{c.beginPath();c.arc(ex,ey+2,3.8,Math.PI*1.15,Math.PI*1.85);c.strokeStyle=OL;c.lineWidth=2.5;c.stroke();
      C(c,ex,ey,7);c.strokeStyle='#d9a73a';c.lineWidth=2.5;c.stroke();});
    c.beginPath();c.moveTo(hx+2,hy-3);c.lineTo(hx+3,hy-3);c.stroke();
  }else{
    const blink=!RM&&((t+(o.seed||0)*1.7)%4.2)<.13;
    eyes.forEach(([ex,ey])=>{if(blink){c.beginPath();c.moveTo(ex-4,ey);c.lineTo(ex+4,ey);c.strokeStyle=OL;c.lineWidth=2.5;c.stroke();return;}
      E(c,ex,ey,4.8,5.8);fs(c,cat.eye,1.8);E(c,ex+.8,ey+.6,2.2,4.4);c.fillStyle='#1a1418';c.fill();C(c,ex-1.4,ey-2.2,1.7);c.fillStyle='#fff';c.fill();});
  }
  E(c,hx-10,hy+6,4,2.5);E(c,hx+16,hy+6,4,2.5);c.fillStyle='rgba(255,110,140,.5)';c.fill();
  c.beginPath();c.moveTo(hx+.5,hy+2.5);c.lineTo(hx+5.5,hy+2.5);c.lineTo(hx+3,hy+5.5);c.closePath();c.fillStyle=cat.kind=='maci'?'#141016':'#f07a8a';c.fill();
  c.beginPath();c.moveTo(hx+3,hy+5.5);c.quadraticCurveTo(hx+1,hy+9,hx-1.5,hy+8);c.moveTo(hx+3,hy+5.5);c.quadraticCurveTo(hx+5,hy+9,hx+7.5,hy+8);c.strokeStyle=cat.kind=='maci'?'#555':OL;c.lineWidth=1.6;c.stroke();
  c.strokeStyle=cat.kind=='maci'?'#e8e8e8':'rgba(255,255,255,.9)';c.lineWidth=1.2;
  [[13,4,27,1],[13,7,27,9],[-7,4,-20,1],[-7,7,-20,9]].forEach(([a,b,d,e])=>{c.beginPath();c.moveTo(hx+a,hy+b);c.lineTo(hx+d,hy+e);c.stroke();});
  c.restore();
}

function daisy(c,x,y,r,rot){for(let i=0;i<8;i++){const a=i/8*TAU+(rot||0);E(c,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.5,r*.24,a);c.fillStyle='#fff';c.fill();c.lineWidth=1.4;c.strokeStyle=OL;c.stroke();}
  C(c,x,y,r*.36);fs(c,'#f6c830',1.4);}

/* Margherita; con o.rebecca la cuginetta Rebecca: capelli scuri raccolti, occhiali bianchi, maglietta gialla */
function drawGirl(c,x,y,o){
  const rb=o.rebecca;
  c.save();c.translate(x,y);c.lineJoin='round';c.lineCap='round';const t=o.t||0,SK='#f8d5bd',HR=rb?'#3a2519':'#6b4226';
  if(rb){c.scale(1.08,1.08);}
  if(!o.noShadow){E(c,0,0,22,6);c.fillStyle='rgba(40,30,40,.18)';c.fill();}
  rr(c,-9,-40,7,37,3);fs(c,SK,2.5);rr(c,2,-40,7,37,3);fs(c,SK,2.5);
  E(c,-6,-3,7,4);fs(c,rb?'#f4f4f4':'#e85a5a',2.5);E(c,6,-3,7,4);fs(c,rb?'#f4f4f4':'#e85a5a',2.5);
  rr(c,-12,-52,24,15,4);fs(c,rb?'#4a6fa8':'#5a7fc0',2.5);
  const wave=o.wave&&!RM?Math.sin(t*7)*6:0;
  const arm=(x1,y1,x2,y2)=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=OL;c.lineWidth=10;c.stroke();c.strokeStyle=SK;c.lineWidth=6;c.stroke();};
  arm(-11,-80,-17,-52);
  if(o.wave)arm(11,-80,22+wave,-100);else arm(11,-80,17,-52);
  rr(c,-13,-84,26,36,7);fs(c,rb?'#ffd23d':'#5cbf60',2.8);
  c.save();rr(c,-13,-84,26,36,7);c.clip();c.fillStyle=rb?'#f2bd1d':'#48a04c';c.fillRect(5,-84,10,36);
  if(rb){c.fillStyle=SK;c.beginPath();c.moveTo(-6,-84);c.quadraticCurveTo(0,-74,6,-84);c.closePath();c.fill();}
  c.restore();rr(c,-13,-84,26,36,7);c.lineWidth=2.8;c.strokeStyle=OL;c.stroke();
  if(!rb)daisy(c,0,-67,7);
  rr(c,-3,-90,6,8,2);c.fillStyle=SK;c.fill();

  T+=dt;hintCD-=dt;

  if(endTimer>0){endTimer-=dt;if(endTimer<=0)showEnd();}
  const p=S.p;let dx=0,dy=0;

    if(keys.arrowleft||keys.a)dx-=1;if(keys.arrowright||keys.d)dx+=1;if(keys.arrowup||keys.w)dy-=1;if(keys.arrowdown||keys.s)dy+=1;

function wallBlocked(x,y){
  if(x<45||x>WW-45||y<272||y>WH-40)return true;
  if(x>HOUSE.x-8&&x<HOUSE.x+HOUSE.w+8&&y<HOUSE.y+HOUSE.h+16)return true;
  if(y<300&&x>BED.x1-30)return true;
  if(Math.hypot(x-TRACTOR.x,(y-TRACTOR.y)*1.6)<62)return true;
  if(Math.hypot(x-TREE.x,y-TREE.y)<22)return true;
  if(x>TABLE.x-104&&x<TABLE.x+104&&y>TABLE.y-46&&y<TABLE.y+50)return true;
  if(Math.abs(x-PEN.x1)<14&&y>PEN.y1-10&&!(y>PEN.gate1&&y<PEN.gate2))return true;
  if(x>PEN.x1&&Math.abs(y-PEN.y1)<14)return true;
  if(x>COOP.x-86&&x<COOP.x+86&&y>COOP.y-60&&y<COOP.y+10)return true;
  if(Math.hypot(x-1150,y-470)<18)return true;
  return false;
}

  openDialog('silvia',['VI LEGGO UNA STORIA.',"C'ERA UNA VOLTA DUE GATTINI: MACI E PIUMI!"],()=>{

LEVELS.push({
  name:'A casa degli zii',ww:WW,wh:WH,bg:'#b98a5c',party:['maci','piumi'],music:'audio/stage5.mp3',
  start:{p:{x:560,y:440},q:{x:520,y:460}},
  quests:['VAI DA ZIA SILVIA','TROVA 3 LIBRI','PORTA I LIBRI ALLA ZIA','VAI DA ZIO SIMONE','PRENDI I 3 ROBOTTINI','TORNA DALLO ZIO SIMONE','TUTTI SUL DIVANO!','CHE BELLA STORIA!'],
  fresh:()=>({count:0,carry:null,screen:false,sofa:false,
    books:BOOK_POS.map(([x,y,col])=>({x,y,col,got:false})),
    caught:0,mice:[[560,600],[300,420],[900,560]].map(([x,y],i)=>({x,y,vx:0,vy:0,f:1,on:false,run:false,home:false,path:[],col:ROBOT_COL[i],k:i,wa:i*2})),
    npc:{silvia:{x:470,y:290,path:[]},simone:{x:810,y:300,path:[]},girl:{x:700,y:640,path:[]}}}),
  progress:()=>S.state>=1&&S.state<=2?[0,1,2].map(i=>bookSVG(i<S.count)).join(''):S.state==4?[0,1,2].map(i=>robotSVG(i<S.caught)).join(''):'',
  blocked(x,y){
    if(wallBlocked(x,y))return true;
    const n=S.npc;return Math.hypot(x-n.silvia.x,y-n.silvia.y)<26||Math.hypot(x-n.girl.x,y-n.girl.y)<22||(S.state>=6&&Math.hypot(x-n.simone.x,y-n.simone.y)<26);
  },
  tick(dt){
    Object.values(S.npc).forEach(n=>{if(!n.path.length)return;const [tx,ty]=n.path[0],d=Math.hypot(tx-n.x,ty-n.y),st=150*dt;
      if(d<=st){n.x=tx;n.y=ty;n.path.shift();}else{n.x+=(tx-n.x)/d*st;n.y+=(ty-n.y)/d*st;}});
    S.mice.forEach(m=>{if(!m.path.length){m.run=false;return;}const [tx,ty]=m.path[0],d=Math.hypot(tx-m.x,ty-m.y),st=170*dt;m.run=true;if(Math.abs(tx-m.x)>1)m.f=tx>m.x?1:-1;
      if(d<=st){m.x=tx;m.y=ty;m.path.shift();if(!m.path.length)m.f=1;}else{m.x+=(tx-m.x)/d*st;m.y+=(ty-m.y)/d*st;}});
  },
  update(dt){
    const p=S.p,s=S.state;
    S.books.forEach(b=>{if(b.got||Math.hypot(b.x-p.x,b.y-p.y)>44)return;
      if(s<1){if(hintCD<=0){floatText(b.x,b.y-60,'PRIMA VAI DA ZIA SILVIA','#ffe9a8');hintCD=2.5;}return;}
      if(s>1)return;
      b.got=true;S.count++;sfx.pick();burst(b.x,b.y-14,22,[b.col,'#fff','#ffc93d']);floatText(b.x,b.y-60,S.count+(S.count==1?' LIBRO!':' LIBRI!'));
      if(S.count>=3){S.carry='libri';floatText(p.x,p.y-90,BRAV()+'!','#ffc93d');setState(2);}else updateHUD();});
    if(s==4)S.mice.forEach(m=>{if(m.home)return;const d=Math.hypot(m.x-p.x,m.y-p.y)||1;
      m.wa+=(R()-.5)*dt*6;let tvx=Math.cos(m.wa)*60,tvy=Math.sin(m.wa)*60;
      if(d<200){const ax=(m.x-p.x)/d,ay=(m.y-p.y)/d,w=Math.sin(T*2.6+m.k*2)*.9;tvx=(ax-ay*w)*135;tvy=(ay+ax*w)*135;}
      const k=Math.min(1,dt*5);m.vx+=(tvx-m.vx)*k;m.vy+=(tvy-m.vy)*k;
      const nx=m.x+m.vx*dt,ny=m.y+m.vy*dt;
      if(this.blocked(nx,m.y)){m.vx*=-.9;m.wa=Math.PI-m.wa;}else m.x=nx;
      if(this.blocked(m.x,ny)){m.vy*=-.9;m.wa=-m.wa;}else m.y=ny;
      if(Math.abs(m.vx)>8)m.f=m.vx>0?1:-1;m.run=Math.hypot(m.vx,m.vy)>30;
      if(d<32){m.home=true;m.vx=m.vy=0;const [dx,dy]=DOCKS[S.caught];m.path=[[m.x,Math.max(m.y,400)],[dx,400],[dx,dy]];
        S.caught++;beep();burst(m.x,m.y-14,24,[m.col,'#5cff7a','#fff']);floatText(m.x,m.y-60,'PRESO!','#ffc93d');
        if(S.caught>=3){floatText(p.x,p.y-90,BRAV()+'!','#ffc93d');setState(5);}else updateHUD();}});
    if(s==6){proximity('sofa',SOFA.x+150,SOFA.y+170,storia,130);return;}
    proximity('silvia',S.npc.silvia.x,S.npc.silvia.y,talkSilvia);
    proximity('simone',SIMONE_TALK.x,SIMONE_TALK.y,talkSimone,60);
    proximity('girl',S.npc.girl.x,S.npc.girl.y,talkGirl);
  },
  guide(){
    const s=S.state,n=S.npc;
    if(s==0||s==2)return{x:n.silvia.x,y:n.silvia.y-150};
    if(s==1)return nearest(S.books.filter(b=>!b.got),50);
    if(s==3||s==5)return{x:SIMONE_TALK.x,y:SIMONE_TALK.y-170};
    if(s==4)return nearest(S.mice.filter(m=>!m.home),50);
    if(s==6)return{x:SOFA.x+150,y:SOFA.y+20};
    return null;
  },
  carry(c,x,y){const b=RM?0:Math.sin(T*5)*3;
    if(S.carry=='libri')drawBookStack(c,x+6,y-80-b);},
  drawBack(c){drawFloor(c);drawWall(c);},
  ents(c,ents){
    const n=S.npc;
    ents.push([234,()=>drawShelf(c)]);
    ents.push([270,()=>drawRack(c)]);
    ents.push([DESK.y+DESK.h,()=>drawDesk(c)]);
    ents.push([SOFA.y+140,()=>drawSofa(c)]);
    ents.push([700,()=>drawLamp(c)]);
    ents.push([700,()=>drawPlant(c)]);
    S.books.forEach(b=>{if(!b.got)ents.push([b.y,()=>drawFallen(c,b)]);});
    if(S.state<6){ents.push([n.simone.y-2,()=>drawChair(c,n.simone.x,n.simone.y)]);
      ents.push([n.simone.y,()=>drawPerson(c,n.simone.x,n.simone.y,{kind:'simone',sit:true,t:T,wave:S.state==3})]);}
    else if(S.sofa)ents.push([SOFA.y+141,()=>drawPerson(c,330,SOFA.y+124,{kind:'simone',sit:true,t:T,wave:true})]);
    else{ents.push([300,()=>drawChair(c,810,300)]);ents.push([n.simone.y,()=>drawPerson(c,n.simone.x,n.simone.y,{kind:'simone',t:T})]);}
    if(S.sofa)ents.push([SOFA.y+141,()=>drawPerson(c,210,SOFA.y+124,{kind:'silvia',sit:true,book:true,t:T})]);
    else ents.push([n.silvia.y,()=>drawPerson(c,n.silvia.x,n.silvia.y,{kind:'silvia',book:S.state!=0,t:T,wave:S.state==0})]);
    ents.push([n.girl.y,()=>drawGirl(c,n.girl.x,n.girl.y,{t:T,wave:S.state>=6})]);
    S.mice.forEach(m=>{if(m.on)ents.push([m.y,()=>robot(c,m,false)]);});
  },
  drawFront(c){
    rr(c,-4,WH-30,WW+8,34,0);fs(c,'#b98a5c');
    if(S.state==1)S.books.forEach((b,i)=>{if(!b.got)sparkle(c,b.x+16,b.y-30,i*.37);});
  }
});
})();

/* ===== Livello 6: surf al mare con mamma e papà ===== */
(()=>{
const WW=5900,WH=900;
const SHORE=600;                 /* sopra c'è il mare, sotto la spiaggia */
const LANE={y1:150,y2:540};      /* dove si surfa */
const START=420,END=4620,SPEED=160,AHEAD=230;
const UMB={x:5420,y:720};
const MAMMA0={x:470,y:680},GIRL0={x:400,y:700};
const starSVG=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#ffc93d" stroke="#3b2a35" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
/* la strada di Margherita tra le onde; alla fine torna verso riva */
function waveY(x){const b=340+Math.sin(x/260)*120+Math.sin(x/97+1)*28;
  if(x<START+300)return 380+(b-380)*Math.max(0,(x-START)/300);
  if(x>END-500){const k=Math.min(1,(x-END+500)/500);return b+(SHORE-30-b)*k;}return b;}
const jumpH=x=>{const k=(x-START)%1100;return x>START+800&&x<END-500&&k<170?Math.sin(k/170*Math.PI)*46:0;};
const UMBS=[[260,640,'#e5533d'],[1300,660,'#4f8fd8'],[2300,650,'#5cbf60'],[3400,660,'#f28cb0'],[4100,650,'#ffc93d'],[5760,680,'#e5533d']];
const SHELLS=[],GULLS=[];
for(let i=0;i<70;i++)SHELLS.push([R()*WW,SHORE+50+R()*(WH-SHORE-90),i%3]);
for(let i=0;i<8;i++)GULLS.push([R()*WW,60+R()*120,R()*6]);

function sparkle(c,x,y,k){if(RM)return;const s=((T*1.6+k)%1.4);if(s>1)return;const r=Math.sin(s*Math.PI)*8;
  c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*.3,y);c.lineTo(x,y+r);c.lineTo(x-r*.3,y);c.closePath();c.moveTo(x-r,y);c.lineTo(x,y-r*.3);c.lineTo(x+r,y);c.lineTo(x,y+r*.3);c.closePath();
  c.fillStyle='#fff7b0';c.fill();}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}c.closePath();fs(c,'#ffc93d',2.2);}
function splash(){tone(300,.12,0,'sine');tone(520,.1,.05,'sine');}

/* ---------- disegno ---------- */
function view(){const cam=camera();return{x0:cam.x-80,x1:cam.x+VW/Z+80};}
function drawSea(c){
  const {x0,x1}=view();
  const g=c.createLinearGradient(0,0,0,SHORE);g.addColorStop(0,'#2f8fd0');g.addColorStop(1,'#5cc6ea');c.fillStyle=g;c.fillRect(x0,-300,x1-x0,SHORE+310);
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=3;
  for(let row=0;row<9;row++){const y=40+row*64+(RM?0:(T*14)%64);
    for(let x=Math.floor(x0/120)*120+(row%2)*60;x<x1;x+=120){c.beginPath();c.moveTo(x-18,y);c.quadraticCurveTo(x,y-9,x+18,y);c.stroke();}}
  /* schiuma della riva */
  c.beginPath();c.moveTo(x0,SHORE+30);for(let x=x0;x<=x1;x+=20)c.lineTo(x,SHORE+(RM?0:Math.sin(x/60+T*2)*4));c.lineTo(x1,SHORE+30);c.closePath();c.fillStyle='#e9f8ff';c.fill();
  c.fillStyle='#f2d9a0';c.beginPath();c.moveTo(x0,WH+300);for(let x=x0;x<=x1;x+=20)c.lineTo(x,SHORE+10+(RM?0:Math.sin(x/60+T*2)*4));c.lineTo(x1,WH+300);c.closePath();c.fill();
  c.fillStyle='rgba(200,160,100,.25)';for(let x=Math.floor(x0/90)*90;x<x1;x+=90){E(c,x+20,SHORE+120,30,5);c.fill();E(c,x+60,SHORE+230,24,4);c.fill();}
  SHELLS.forEach(([x,y,k])=>{if(x<x0||x>x1)return;if(k==0){c.beginPath();c.arc(x,y,6,Math.PI,0);c.closePath();fs(c,'#ffd0c0',1.6);}else if(k==1){C(c,x,y,3.5);fs(c,'#fff',1.4);}else star(c,x,y,5);});
  /* boe che segnano il percorso */
  for(let x=START+600;x<END-400;x+=700){const y=LANE.y1-26+(RM?0:Math.sin(T*2+x)*3);if(x<x0||x>x1)continue;C(c,x,y,10);fs(c,'#e5533d',2.2);c.fillStyle='#fff';c.fillRect(x-10,y-2,20,4);
    const y2=LANE.y2+30+(RM?0:Math.sin(T*2+x+1)*3);C(c,x,y2,10);fs(c,'#e5533d',2.2);c.fillStyle='#fff';c.fillRect(x-10,y2-2,20,4);}
}
function drawDolphin(c,x,y,k){
  const ph=(T*.7+k)%3;if(RM||ph>1)return;const a=ph*Math.PI,hx=x+ph*120-60,hy=y-Math.sin(a)*60;
  c.save();c.translate(hx,hy);c.rotate(-Math.cos(a)*.8);
  c.beginPath();c.moveTo(-26,0);c.quadraticCurveTo(-6,-16,22,-4);c.quadraticCurveTo(30,0,22,3);c.quadraticCurveTo(-6,10,-26,0);c.closePath();fs(c,'#7a9cc0',2.4);
  c.beginPath();c.moveTo(-4,-10);c.lineTo(2,-20);c.lineTo(6,-8);c.closePath();fs(c,'#7a9cc0',2);
  c.beginPath();c.moveTo(-26,0);c.lineTo(-34,-8);c.lineTo(-32,6);c.closePath();fs(c,'#7a9cc0',2);
  C(c,14,-4,1.8);c.fillStyle=OL;c.fill();c.restore();
  E(c,x+(ph<.5?-60:60),y+2,18,4);c.fillStyle='rgba(255,255,255,.7)';c.fill();
}
function drawGulls(c){const {x0,x1}=view();c.strokeStyle=OL;c.lineWidth=2.5;
  GULLS.forEach(([gx,gy,k])=>{const x=(gx+(RM?0:T*30))%WW,y=gy+Math.sin(T+k)*8;if(x<x0||x>x1)return;const f=RM?0:Math.sin(T*6+k)*5;
    c.beginPath();c.moveTo(x-14,y-f);c.quadraticCurveTo(x-6,y-8,x,y);c.quadraticCurveTo(x+6,y-8,x+14,y-f);c.stroke();});}
function board(c,x,y,col,len){const L2=len||48;
  E(c,x,y+2,L2+4,7);c.fillStyle='rgba(255,255,255,.6)';c.fill();
  E(c,x,y-2,L2,9);fs(c,col,2.4);c.fillStyle='rgba(255,255,255,.75)';c.fillRect(x-L2+8,y-3,L2*2-16,3);}
function umbrella(c,x,y,col){
  shadowAt(c,x+10,y+4,50,10);
  rr(c,x-40,y-4,80,14,4);fs(c,col==='#ffc93d'?'#6a8ff0':'#fff4dc',2);
  c.beginPath();c.moveTo(x,y);c.lineTo(x+6,y-96);c.strokeStyle=OL;c.lineWidth=5;c.stroke();c.strokeStyle='#fff';c.lineWidth=2.5;c.stroke();
  c.beginPath();c.moveTo(x-54,y-84);c.quadraticCurveTo(x+6,y-140,x+66,y-84);c.closePath();fs(c,col);
  c.strokeStyle='#fff';c.lineWidth=5;[-30,6,42].forEach(d=>{c.beginPath();c.moveTo(x+6,y-118);c.lineTo(x+d,y-86);c.stroke();});
}
function sandcastle(c,x,y){shadowAt(c,x,y,40,8);rr(c,x-34,y-30,68,30,4);fs(c,'#e6c47e');[-24,0,24].forEach(d=>{rr(c,x+d-9,y-52,18,24,3);fs(c,'#e6c47e',2);});
  c.beginPath();c.moveTo(x,y-52);c.lineTo(x,y-74);c.strokeStyle=OL;c.lineWidth=2;c.stroke();c.beginPath();c.moveTo(x,y-74);c.lineTo(x+14,y-68);c.lineTo(x,y-62);c.closePath();fs(c,'#e5533d',1.6);}
function cooler(c,x,y){shadowAt(c,x,y,30,6);rr(c,x-26,y-30,52,30,6);fs(c,'#4f8fd8');rr(c,x-28,y-36,56,10,4);fs(c,'#fff',2);}
function cone(c,x,y,col){c.beginPath();c.moveTo(x-7,y-10);c.lineTo(x,y+8);c.lineTo(x+7,y-10);c.closePath();fs(c,'#e6b06a',1.8);C(c,x,y-13,7);fs(c,col,1.8);}

/* ---------- logica ---------- */
function startSurf(){
  S.surf=true;setState(1);splash();
  S.p.x=START;S.p.y=380;S.q.x=START-80;S.q.y=380;trail=[];target=null;
  S.girlX=START+AHEAD;S.lastStar=S.girlX;
  say('PRENDI LE STELLINE!','cecilia');floatText(START+120,300,'VIA!','#ffc93d');
}
function talkMamma(){
  if(S.state==0)openDialog('cecilia',[`CIAO ${N()}!`,'ANDIAMO A FARE SURF!','SEGUI MARGHERITA SULLE ONDE!'],()=>openDialog('girl',[`${N()}! GIOCHIAMO?`],startSurf));
}
function talkPapa(){
  if(S.state<2)openDialog('andrea',[`CIAO ${N()}!`]);
  else if(S.state==2)openDialog('andrea',[`CIAO ${N()}!`,S.cur=='piumi'?'CHE BRAVA SURFISTA!':'CHE BRAVO SURFISTA!','ECCO IL GELATO!'],()=>{
    S.gelato=true;setState(3);sfx.win();confetti(UMB.x,UMB.y-90);floatText(UMB.x,UMB.y-150,'GELATO!','#ffc93d');
    finish('Che bello fare surf con mamma e papà!'+(S.stars?` Hai preso ${S.stars} ${S.stars==1?'stellina':'stelline'}!`:''),2.6);});
}
function landing(){
  S.surf=false;setState(2);splash();
  S.p.y=Math.max(S.p.y,SHORE+50);S.q.x=S.p.x-60;S.q.y=S.p.y+10;trail=[];target=null;
  burst(S.p.x,S.p.y-20,30,['#fff','#8fd6f5','#ffc93d']);floatText(S.p.x,S.p.y-100,S.stars+' STELLINE!','#ffc93d');
  S.npc.girl={x:END+420,y:SHORE+130};S.npc.mamma={x:END+520,y:SHORE+96};
  say('CHE BELLE ONDE!','cecilia');
}

LEVELS.push({
  name:'Surf al mare',ww:WW,wh:WH,bg:'#f2d9a0',party:['maci','piumi'],music:'audio/stage6.mp3',
  start:{p:{x:300,y:720},q:{x:250,y:740}},
  quests:['VAI DA MAMMA CECILIA','SEGUI MARGHERITA SULLE ONDE!','VAI DA PAPÀ ANDREA','GELATO!'],
  fresh:()=>({surf:false,stars:0,gelato:false,girlX:0,lastStar:0,starList:[],
    npc:{girl:{...GIRL0},mamma:{...MAMMA0}}}),
  progress:()=>S.state==1?`${starSVG}<b style="font-size:22px;line-height:26px">${S.stars}</b>`:'',
  blocked(x,y){
    if(S.surf)return Math.abs(x-S.p.x)>.01||y<LANE.y1||y>LANE.y2;
    if(x<40||x>WW-40||y<SHORE+40||y>WH-30)return true;
    if(Math.hypot(x-UMB.x,y-UMB.y)<30)return true;
    const n=S.npc;return Math.hypot(x-n.mamma.x,y-n.mamma.y)<26||Math.hypot(x-n.girl.x,y-n.girl.y)<22;
  },
  tick(dt){
    /* sulle onde il gatto va avanti da solo: si sceglie solo su o giù */
    if(S.surf&&target)target.x=S.p.x;
  },
  update(dt){
    const p=S.p,s=S.state;
    if(S.surf){
      p.x+=SPEED*dt;p.f=1;S.girlX=p.x+AHEAD;
      const last=trail[trail.length-1];if(!last||Math.hypot(last.x-p.x,last.y-p.y)>4)trail.push({x:p.x,y:p.y});if(trail.length>60)trail.shift();
      if(S.girlX-S.lastStar>85&&S.girlX<END-200){S.lastStar=S.girlX;S.starList.push({x:S.girlX-10,y:waveY(S.girlX-10)-6,t:0});}
      S.starList=S.starList.filter(st=>{st.t+=dt;
        if(Math.hypot(st.x-p.x,st.y-(p.y-14))<48){S.stars++;sfx.pick();burst(st.x,st.y,10,['#ffc93d','#fff']);floatText(st.x,st.y-30,'+1','#ffe9a8');updateHUD();return false;}
        return st.x>p.x-300;});
      const q=S.q,tp=trail.find(t=>t.x>=p.x-90)||trail[0]||p;q.x=p.x-90;q.y+=(tp.y-q.y)*Math.min(1,dt*6);q.f=1;q.moving=false;
      if(p.x>=END)landing();
      return;
    }
    if(s==0)proximity('mamma',S.npc.mamma.x,S.npc.mamma.y,talkMamma);
    if(s==0)proximity('girl',S.npc.girl.x,S.npc.girl.y,talkMamma);
    proximity('papa',UMB.x-60,UMB.y+10,talkPapa,80);
  },
  guide(){
    const s=S.state;
    if(s==0)return{x:S.npc.mamma.x,y:S.npc.mamma.y-150};
    if(s==1){const x=S.girlX-AHEAD+90;return{x,y:waveY(x)-50};}
    if(s==2)return{x:UMB.x-60,y:UMB.y-160};
    return null;
  },
  drawBack(c){
    drawSea(c);

function talkRebecca(){
  const s=S.state;
  if(s==0)openDialog('rebecca',[`CIAO ${N()}!`,'SONO SPARITI TUTTI I GIOCHI!','MI AIUTI A TROVARLI?',"CERCA L'ORSETTO NELLE CESTE!"],()=>setState(1));
  else if(s==1)openDialog('rebecca',["CERCA L'ORSETTO NELLE CESTE!"]);
  else if(s==2)openDialog('rebecca',['IL MIO ORSETTO!',`GRAZIE ${N()}!`,'TROVA 3 PEZZI DEL PUZZLE!'],()=>{S.carry=null;S.bear=true;sfx.pick();burst(RUG.x1+60,RUG.y1+20,22,['#c98b55','#e5533d','#fff']);setState(3);});
  else if(s==3)openDialog('rebecca',['TROVA 3 PEZZI DEL PUZZLE!']);
  else if(s==4)openDialog('rebecca',['CHE BELLO IL PUZZLE!'],()=>{S.carry=null;S.puzzle=true;sfx.pick();burst(RUG.x2-80,RUG.y1+40,26,['#e5533d','#4f8fd8','#5cbf60','#fff']);floatText(RUG.x2-80,RUG.y1-30,'MACI E PIUMI!','#ffc93d');
    openDialog('rebecca',['MANCA LA PALLA!','SPINGI LA PALLA FINO A NOI!'],()=>{S.ball.on=true;setState(5);});});
  else if(s==5)openDialog('rebecca',['SPINGI LA PALLA FINO A NOI!']);
}
function talkGirl(){if(S.state<6)openDialog('girl',[`${N()}! GIOCHIAMO?`]);}
function festa(){
  openDialog('rebecca',[`${BRAV()} ${N()}!`,'ADESSO GIOCHIAMO TUTTI INSIEME!'],()=>
    openDialog('girl',['GRAZIE! VI VOGLIO BENE!'],()=>{
      setState(6);sfx.win();confetti((RUG.x1+RUG.x2)/2,RUG.y1-40);floatText((RUG.x1+RUG.x2)/2,RUG.y1-110,'TUTTI A GIOCARE!','#ffc93d');
      finish('Che bello giocare tutti insieme con Rebecca!',2.8);}));
}

LEVELS.push({
  name:'A giocare da Rebecca',ww:WW,wh:WH,bg:'#9ad66f',party:['maci','piumi'],music:'audio/stage1.mp3',
  start:{p:{x:240,y:400},q:{x:200,y:416}},
  quests:['VAI DA REBECCA',"CERCA L'ORSETTO NELLE CESTE","PORTA L'ORSETTO A REBECCA",'TROVA 3 PEZZI DEL PUZZLE','PORTA IL PUZZLE A REBECCA','SPINGI LA PALLA SULLA COPERTA','TUTTI A GIOCARE!'],
  fresh:()=>({opened:0,count:0,carry:null,bear:false,puzzle:false,
    ceste:CESTE.map(([x,y])=>({x,y,open:false,shake:0})),
    pieces:PIECES.map(([x,y,col],i)=>({x,y,col,got:false,rot:(i-1)*.4})),
    ball:{x:BALL0.x,y:BALL0.y,vx:0,vy:0,spin:0,on:false,home:false},
    npc:{rebecca:{x:680,y:520},girl:{x:520,y:520}}}),
  progress:()=>S.state>=1&&S.state<=2?bearSVG(S.state==2):S.state>=3&&S.state<=4?[0,1,2].map(i=>pieceSVG(i<S.count)).join(''):S.state==5?ballSVG(false):'',
  blocked(x,y){
    if(wallBlocked(x,y))return true;
    const n=S.npc;return Math.hypot(x-n.rebecca.x,y-n.rebecca.y)<24||Math.hypot(x-n.girl.x,y-n.girl.y)<22;
  },
  tick(dt){
    S.ceste.forEach(b=>{if(b.shake>0)b.shake=Math.max(0,b.shake-dt);});
    const b=S.ball;if(!b.on)return;
    if(b.home){const tx=(RUG.x1+RUG.x2)/2,ty=RUG.y1+70,d=Math.hypot(tx-b.x,ty-b.y);if(d>2){const st=Math.min(d,120*dt);b.x+=(tx-b.x)/d*st;b.y+=(ty-b.y)/d*st;b.spin+=st/17;}return;}
    const f=Math.exp(-1.8*dt);b.vx*=f;b.vy*=f;
    const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;
    if(wallBlocked(nx,b.y)){b.vx*=-.8;}else b.x=nx;
    if(wallBlocked(b.x,ny)){b.vy*=-.8;}else b.y=ny;
    b.spin+=(b.vx>=0?1:-1)*Math.hypot(b.vx,b.vy)*dt/17;
  },
  update(dt){
    const p=S.p,s=S.state;
    S.ceste.forEach(b=>{if(b.open||Math.hypot(b.x-p.x,b.y+20-p.y)>50)return;
      if(s<1){if(hintCD<=0){floatText(b.x,b.y-80,'PRIMA VAI DA REBECCA','#ffe9a8');hintCD=2.5;}return;}
      if(s!=1)return;
      b.open=true;b.shake=.5;S.opened++;
      /* l'orsetto è sempre nell'ultima cesta che si apre */
      if(S.opened>=3){S.carry='orsetto';sfx.pick();burst(b.x,b.y-50,24,['#c98b55','#e5533d','#fff']);floatText(b.x,b.y-90,"L'ORSETTO!",'#ffc93d');setState(2);}
      else{boing();floatText(b.x,b.y-90,'VUOTA!','#fff');}});
    S.pieces.forEach(g=>{if(g.got||Math.hypot(g.x-p.x,g.y-p.y)>44)return;
      if(s<3){if(hintCD<=0){floatText(g.x,g.y-60,'UN PEZZO DEL PUZZLE!','#ffe9a8');hintCD=2.5;}return;}
      if(s>3)return;
      g.got=true;S.count++;sfx.pick();burst(g.x,g.y-14,20,[g.col,'#fff','#ffc93d']);floatText(g.x,g.y-60,S.count+(S.count==1?' PEZZO!':' PEZZI!'));
      if(S.count>=3){S.carry='puzzle';floatText(p.x,p.y-90,BRAV()+'!','#ffc93d');setState(4);}else updateHUD();});
    if(s==5){const b=S.ball,d=Math.hypot(b.x-p.x,b.y-p.y);
      if(!b.home&&d<36){const ax=(b.x-p.x)/(d||1),ay=(b.y-p.y)/(d||1);
        /* un piccolo aiuto: la palla va un po' verso la coperta */
        const gx=(RUG.x1+RUG.x2)/2-b.x,gy=(RUG.y1+RUG.y2)/2-b.y,gd=Math.hypot(gx,gy)||1;
        let dx=ax*.7+gx/gd*.3,dy=ay*.7+gy/gd*.3;const dl=Math.hypot(dx,dy)||1;
        b.vx=dx/dl*280;b.vy=dy/dl*280;boing();}
      if(!b.home&&b.x>RUG.x1+10&&b.x<RUG.x2-10&&b.y>RUG.y1+10&&b.y<RUG.y2+10){b.home=true;b.vx=b.vy=0;sfx.pick();burst(b.x,b.y-20,24,['#e5533d','#4f8fd8','#fff']);floatText(b.x,b.y-70,'GOL!','#ffc93d');setTimeout(()=>{if(S.state==5)festa();},700);}}
    proximity('rebecca',S.npc.rebecca.x,S.npc.rebecca.y,talkRebecca);
    proximity('girl',S.npc.girl.x,S.npc.girl.y,talkGirl);
  },
  guide(){
    const s=S.state,n=S.npc;
    if(s==0||s==2||s==4)return{x:n.rebecca.x,y:n.rebecca.y-160};
    if(s==1)return nearest(S.ceste.filter(b=>!b.open),70);
    if(s==3)return nearest(S.pieces.filter(g=>!g.got),40);
    if(s==5&&!S.ball.home)return{x:S.ball.x,y:S.ball.y-60};
    return null;
  },
  carry(c,x,y){const b=RM?0:Math.sin(T*5)*3;
    if(S.carry=='orsetto')bear(c,x+6,y-74-b,.7);
    else if(S.carry=='puzzle')PIECES.forEach(([,,col],i)=>piece(c,x+6+(i-1)*10,y-84-b-i*5,col,.6,(i-1)*.3));},
  drawBack(c){
    drawSky(c);
    c.fillStyle='#9ad66f';c.fillRect(0,256,WW,WH-256);
    c.strokeStyle='#7fbf55';c.lineWidth=2;tufts.forEach(([x,y])=>{c.beginPath();c.moveTo(x-4,y-5);c.lineTo(x,y);c.lineTo(x+4,y-6);c.stroke();});
    flowers.forEach(([x,y,k])=>drawFlower(c,x,y,k));
    c.beginPath();c.moveTo(225,300);c.quadraticCurveTo(250,470,RUG.x1,RUG.y1+50);c.strokeStyle='#d8c08a';c.lineWidth=34;c.stroke();
    drawRug(c);
  },
  ents(c,ents){
    const n=S.npc;
    ents.push([HOUSE.y+HOUSE.h,()=>drawHouse(c)]);
    ents.push([TREE.y,()=>drawTree(c)]);
    ents.push([SWING.y,()=>drawSwing(c)]);
    S.ceste.forEach(b=>ents.push([b.y,()=>cesta(c,b)]));
    S.pieces.forEach(g=>{if(!g.got)ents.push([g.y,()=>{shadowAt(c,g.x,g.y,14,4);piece(c,g.x,g.y-10,g.col,1,g.rot);}]);});
    if(S.bear)ents.push([RUG.y1+44,()=>bear(c,RUG.x1+56,RUG.y1+44,.75)]);
    if(S.puzzle)ents.push([RUG.y1+60,()=>drawPuzzle(c,RUG.x2-80,RUG.y1+40)]);
    if(S.ball.on)ents.push([S.ball.y,()=>ball(c,S.ball.x,S.ball.y,S.ball.spin)]);
    ents.push([n.rebecca.y,()=>drawGirl(c,n.rebecca.x,n.rebecca.y,{t:T,rebecca:true,wave:S.state==0||S.state>=6})]);
    ents.push([n.girl.y,()=>drawGirl(c,n.girl.x,n.girl.y,{t:T,wave:S.state>=6})]);
  },
  drawFront(c){
    if(S.state==1)S.ceste.forEach((b,i)=>{if(!b.open)sparkle(c,b.x+20,b.y-60,i*.37);});
    if(S.state==3)S.pieces.forEach((g,i)=>{if(!g.got)sparkle(c,g.x+16,g.y-30,i*.37);});
    if(S.state==5&&!S.ball.home)sparkle(c,S.ball.x+18,S.ball.y-40,.1);
  }
});
})();

let introX=0;
function introMusicStart(){
  if(!musicOn||(S&&S.started))return;
  if(!music.src.endsWith(INTRO_MUSIC))music.src=INTRO_MUSIC;
  music.play().catch(()=>{});
}
/* i browser fanno partire la musica solo dopo un gesto: sui telefoni conta quando il dito si stacca */
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{if(S&&!S.started&&music.paused)introMusicStart();},true));

function sign(c,x,n){
  rr(c,x-4,WALK-120,8,110,2);fs(c,'#8a5a36',2.4);
  rr(c,x-30,WALK-132,60,38,6);fs(c,'#e0a868',2.6);
  c.fillStyle=OL;c.font='700 26px Fredoka, "Trebuchet MS", sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(n,x,WALK-112);c.textBaseline='alphabetic';
}
function bush(c,x,y,col,dots){C(c,x-18,y-14,18);C(c,x+16,y-14,20);C(c,x,y-28,22);c.lineWidth=5;c.strokeStyle=OL;c.stroke();
  C(c,x-18,y-14,18);c.fillStyle=col;c.fill();C(c,x+16,y-14,20);c.fill();C(c,x,y-28,22);c.fill();
  if(dots)[[-14,-20],[10,-30],[20,-12],[-4,-12],[0,-38]].forEach(([a,b])=>{C(c,x+a,y+b,4);fs(c,dots,1.4);});}

function introSoap(c,x){

function introRebecca(c,x){

  drawGirl(c,x+200,WALK-40,{t:T,rebecca:true,wave:true});

/* ---------- disegno ---------- */
let introCatX=0;
function drawIntro(dt){
  const c=ctx,k=Math.max(.6,VH/IH),vw=VW/k;
  if(!RM)introX+=dt*75;
  const len=SEG*INTRO.length;introX%=len;
  introCatX=vw*.42+introX;           /* posizione dei gatti nel mondo della sfilata */
  c.setTransform(DPR*k,0,0,DPR*k,0,0);
  const vh=VH/k,top=Math.min(0,vh-IH);
  c.translate(-introX,0);
  const x0=introX,x1=introX+vw,first=Math.floor(x0/SEG)-1,last=Math.floor(x1/SEG)+1;
  /* cielo e prato sfumano da un posto all'altro */
  const grad=key=>{const g=c.createLinearGradient(first*SEG+SEG/2,0,last*SEG+SEG/2,0),n=last-first;
    for(let i=first;i<=last;i++)g.addColorStop((i-first)/n,INTRO[((i%INTRO.length)+INTRO.length)%INTRO.length][key]);return g;};
  c.fillStyle=grad('sky');c.fillRect(x0-10,top-10,vw+20,HZ-top+10);
  c.fillStyle=grad('ground');c.fillRect(x0-10,HZ,vw+20,Math.max(vh,IH)-HZ+10);
  [[200,70],[640,50],[1000,110],[1500,60]].forEach(([cx0,cy])=>{const cx=x0+((cx0-introX*.3)%(vw+200)+vw+200)%(vw+200)-100;c.fillStyle='#fff';C(c,cx,cy,18);c.fill();C(c,cx+22,cy-9,23);c.fill();C(c,cx+46,cy,18);c.fill();});
  c.beginPath();c.moveTo(x0-10,WALK+30);c.lineTo(x1+10,WALK+30);c.strokeStyle='rgba(120,90,60,.18)';c.lineWidth=60;c.stroke();
  for(let i=first;i<=last;i++){const n=((i%INTRO.length)+INTRO.length)%INTRO.length,sx=i*SEG;
    INTRO[n].draw(c,sx);sign(c,sx+40,n+1);}
  /* Piumi insegue Maci, ogni tanto saltano */
  const hop=RM?0:Math.max(0,Math.sin(T*2.2))**8*26;
  drawCat(c,introCatX-80,WALK+20-(RM?0:Math.max(0,Math.sin(T*2.2-1.2))**8*22),CATS.piumi,{f:1,t:T,moving:!RM,seed:2});
  drawCat(c,introCatX,WALK+24-hop,CATS.maci,{f:1,t:T,moving:!RM,seed:1});
}

/* ===== Avvio ===== */
const lv=document.getElementById('levels');
lv.innerHTML=LEVELS.map((l,i)=>`<button class="lvl" data-l="${i}"><b>${i+1}</b><span>${l.name}</span></button>`).join('');
lv.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>play(+b.dataset.l));
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render(dt);requestAnimationFrame(frame);}
function start(data){
  if(data&&data.S&&LEVELS[data.S.lvl]){S=data.S;L=LEVELS[S.lvl];music.src=L.music;updateHUD();drawPortraits();if(S.started)document.getElementById('start').hidden=true;}
  else startLevel(0);
  /* carica subito la musica dell'intro e prova a farla partire (se il browser lo permette) */
  if(!S.started){music.preload='auto';introMusicStart();}
  document.getElementById('bMus').classList.toggle('on',musicOn);
  requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawPortraits);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
if(location.hash=='#debug')window.__gioco={get S(){return S;},setState,play};

})();
</script>
