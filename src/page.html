<title>Maci e Piumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen canvas world, storybook HUD panels pinned to the corners, parchment dialog at the bottom */
:root{
  --ink:#3b2a35; --paper:#fff4dc; --paper-2:#f3dcae; --red:#e5533d; --gold:#ffc93d;
  --leaf:#4caf50; --leaf-dark:#2f8a3a; --grass:#6aa94b; --muted:#8a6f60;
  --display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font-family:var(--display);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.quest{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px 10px;max-width:min(360px,calc(100% - 320px));display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;background:var(--red);color:#fff;font-weight:600;font-size:13px;letter-spacing:.08em;padding:2px 10px;border-radius:99px;border:2px solid var(--ink)}
#questText{font-weight:700;font-size:clamp(17px,2.6vw,24px);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
#questProg{display:flex;gap:6px}
#questProg svg{width:26px;height:26px}
.party{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 6px 6px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:13px;letter-spacing:.05em;transition:transform .12s}
.pc canvas{width:52px;height:52px}
.pc.on{background:var(--gold);transform:translateY(-2px)}
.pc.mus svg{width:52px;height:52px;padding:8px;box-sizing:border-box}
.pc.mus.on{background:var(--paper-2);transform:none}
.pc.mus.on .x{display:none}
.pc:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 24px));box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px 14px}
.pic{flex:none;width:92px;height:92px;border-radius:50%;background:#bfe3a5;border:3px solid var(--ink);overflow:hidden}
.pic canvas{width:100%;height:100%}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dname{align-self:flex-start;background:var(--gold);border:2px solid var(--ink);border-radius:99px;padding:1px 10px;font-weight:600;font-size:14px;letter-spacing:.06em}
.dtext{font-weight:700;font-size:clamp(20px,3.6vw,30px);line-height:1.15;letter-spacing:.02em}
.dbtns{display:flex;flex-direction:column;gap:8px}
.btn{border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:700;font-size:20px;padding:8px 16px;background:var(--leaf);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper-2);color:var(--ink);padding:6px 10px;display:grid;place-items:center}
.btn.ghost svg{width:26px;height:26px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,25,45,.35);padding:16px}
.card{position:relative;text-align:center;padding:30px 28px 26px;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ribbon{position:absolute;top:-18px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 16px;font-weight:700;letter-spacing:.12em;font-size:15px}
.card h1{margin:4px 0 0;font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.02;text-wrap:balance;color:var(--ink)}
.card h1 em{font-style:normal;color:var(--red)}
.card p{margin:0;font-size:17px;color:var(--muted);font-weight:500;max-width:32ch}
.card .btn{font-size:26px;padding:10px 34px;background:#f28c28;margin-top:8px}
.levels{display:grid;gap:10px;width:100%;margin-top:6px}
.lvl{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);text-align:left}
.lvl:hover{background:var(--gold)}
.lvl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lvl b{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#f28c28;color:#fff;border:3px solid var(--ink);font-size:22px}
.lvl span{font-weight:600;font-size:19px;line-height:1.1}
.card .btn.alt{background:var(--leaf);font-size:20px;padding:8px 24px;margin-top:0}
.link{background:none;border:0;font-weight:600;font-size:15px;color:var(--muted);text-decoration:underline;padding:4px}
.stars{display:flex;gap:6px}
.stars svg{width:52px;height:52px}
@media (max-width:520px){.pic{width:64px;height:64px}.dialog{gap:10px;padding:10px}.btn{font-size:18px;padding:6px 12px}.pc canvas,.pc.mus svg{width:42px;height:42px}.quest{max-width:calc(100% - 270px)}.party{gap:6px}}
body.menu .quest,body.menu #bBack,body.menu #bMaci,body.menu #bPiumi{display:none}
body.menu .party{z-index:2}
#start.splash .levels,#start.splash p,#start.splash .ribbon,#start:not(.splash) #bPlay{display:none}
#start #bPlay{font-size:34px;padding:12px 44px}
#start{background:rgba(40,25,45,.12);place-items:start center;padding-top:max(28px,4vh);overflow:auto}
#start .card{max-width:600px;padding:26px 22px 20px}
#start .levels{grid-template-columns:1fr 1fr}#start .lvl:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;min-width:50%}
@media (max-width:639px){#start{padding-top:calc(78px + env(safe-area-inset-top,0px))}#start .card{padding:22px 12px 14px;gap:6px}#start .card p{display:none}#start .card h1{font-size:30px}#start .levels{gap:8px}#start .lvl{gap:8px;padding:7px 8px}#start .lvl b{width:30px;height:30px;font-size:17px}#start .lvl span{font-size:15px}}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>

<canvas id="game" aria-label="Il gioco"></canvas>

<div class="quest panel" id="quest" aria-live="polite">
  <span class="tag">MISSIONE</span>
  <div id="questText">VAI DA NONNA EMMA</div>
  <div id="questProg"></div>
</div>

<div class="party">
  <button class="pc mus" id="bBack" aria-label="Torna ai livelli"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>LIVELLI</button>
  <button class="pc on" id="bMaci" aria-label="Gioca con Maci"><canvas width="104" height="104"></canvas>MACI</button>
  <button class="pc" id="bPiumi" aria-label="Gioca con Piumi"><canvas width="104" height="104"></canvas>PIUMI</button>
  <button class="pc mus on" id="bMus" aria-label="Accendi o spegni la musica" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="currentColor"/><circle cx="17.5" cy="16" r="3" fill="currentColor"/><path class="x" d="M3 3l18 18" stroke="#e5533d" stroke-width="3" stroke-linecap="round"/></svg>MUSICA</button>
</div>

<div class="dialog panel" id="dlg" hidden>
  <div class="pic"><canvas id="dlgPic" width="184" height="184"></canvas></div>
  <div class="dbody"><span class="dname" id="dName"></span><div class="dtext" id="dText"></div></div>
  <div class="dbtns">
    <button class="btn ghost" id="dSay" aria-label="Ascolta la frase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="btn" id="dOk">OK</button>
  </div>
</div>

<div class="overlay splash" id="start">
  <div class="card panel">
    <span class="ribbon">SCEGLI IL LIVELLO</span>
    <h1><em>Maci</em> e <em>Piumi</em></h1>
    <p>Tocca il pavimento o il prato per far camminare il gatto. Sul computer puoi usare le frecce.</p>
    <div class="levels" id="levels"></div>
    <button class="btn" id="bPlay">&#9654; GIOCA</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card panel">
    <span class="ribbon" id="endRibbon">LIVELLO COMPLETATO</span>
    <div class="stars" id="stars"></div>
    <h1>MIAO&#8209;RAVIGLIOSO!</h1>
    <p id="endText"></p>
    <button class="btn" id="next">LIVELLO 2</button>
    <button class="btn alt" id="again">GIOCA ANCORA</button>
    <button class="link" id="menu">Torna ai livelli</button>
  </div>
</div>

<script>
/*SCRIPTS*/
</script>
